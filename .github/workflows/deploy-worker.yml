# Deploys the render worker to Fly.io.
#
# The worker lives outside Vercel because ffmpeg cannot run there. It is built
# and deployed from CI rather than from a laptop so the deployed image always
# corresponds to a commit on main.
name: Deploy worker

# Behind Checks, not beside it.
#
# This used to be `on: push` with a paths filter, which meant the deploy and the
# checks raced: both started on the same commit, and the deploy finished first
# because it does less. A commit that failed every suite in tools/ shipped to
# the machine that renders customers' video, and the red X arrived afterwards,
# on a run whose result changed nothing.
#
# Nothing ever caught that, because it does not look like a failure. Checks goes
# red, somebody sees it, somebody pushes a fix — and in between, production ran
# the bad build. The 12 August outage was two days long for the same shape of
# reason: the thing that would have noticed was a person choosing to look.
#
# `workflow_run` is the only trigger GitHub offers that waits for another
# workflow, and it comes with two costs paid below. It cannot filter on paths,
# so the job decides for itself whether anything the worker is built from
# actually changed. And it always runs against the default branch's copy of this
# file, which is what we want here and is worth knowing.
on:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A manual run is somebody deciding; a triggered one only proceeds if the
    # checks it waited for actually passed. `workflow_run` fires on *completed*,
    # which includes failed, cancelled and timed out.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # The commit Checks ran against, not whatever main points at now. Two
      # pushes in a minute would otherwise deploy the second from a run that
      # only ever tested the first.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 2

      # The paths filter `workflow_run` cannot have.
      #
      # Without it every green run of Checks would redeploy the worker, which is
      # a Fly build and a rolling restart for a commit that changed a landing
      # page. The list is the same one the trigger used to carry, and
      # `deploy-test` compares it against what the worker is actually built
      # from, so a new workspace package cannot go missing from it in silence.
      - name: Decide whether the worker changed
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run: deploying regardless"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PATHS is the list this workflow watches. Keep it beside the one in
          # the comment above; deploy-test reads this block.
          PATHS="artifacts/worker/ lib/db/ lib/api-zod/ lib/object-store/ lib/mail/ pnpm-lock.yaml .github/workflows/deploy-worker.yml"
          touched="$(git diff --name-only HEAD^ HEAD || true)"
          if [ -z "$touched" ]; then
            echo "no parent to compare against: deploying to be safe"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for prefix in $PATHS; do
            if echo "$touched" | grep -q "^$prefix"; then
              echo "changed: $prefix"
              echo "worker=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "nothing the worker is built from changed"
          echo "worker=false" >> "$GITHUB_OUTPUT"

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.changed.outputs.worker == 'true'

      # Ask about the app directly instead of pattern-matching a table meant for
      # humans. `flyctl apps list | grep '^editly-worker'` anchored on the app
      # name being at the start of a line; newer flyctl indents its table, so the
      # anchor stopped matching, the `||` branch ran on every deploy, and create
      # failed with "Name has already been taken" — which is why every run of
      # this workflow had failed since the app first existed.
      - name: Create the app if it does not exist yet
        if: steps.changed.outputs.worker == 'true'
        run: |
          if flyctl status --app editly-worker > /dev/null 2>&1; then
            echo "editly-worker already exists"
          else
            echo "editly-worker not found, creating it"
            flyctl apps create editly-worker --org personal
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Set before deploying: the worker exits immediately without these, and a
      # deploy that cannot pass its health window is rolled back.
      # Refuse before touching anything, not halfway through. Without this the
      # step below would happily run `flyctl secrets set DATABASE_URL=` with an
      # empty value: Fly stores it, `flyctl secrets list` shows it as present,
      # and the worker dies on the next deploy looking configured. A missing
      # secret must look missing.
      - name: Refuse to deploy with a secret missing
        if: steps.changed.outputs.worker == 'true'
        run: |
          set -euo pipefail
          missing=()
          [ -n "${DATABASE_URL:-}" ]              || missing+=(WORKER_DATABASE_URL)
          [ -n "${SUPABASE_URL:-}" ]              || missing+=(WORKER_SUPABASE_URL)
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || missing+=(WORKER_SUPABASE_SERVICE_ROLE_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "Nothing was changed on Fly - the running worker is untouched."
            exit 1
          fi
          echo "all three worker secrets are present"
        env:
          DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.WORKER_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.WORKER_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Push runtime secrets
        if: steps.changed.outputs.worker == 'true'
        run: |
          set -euo pipefail
          # The three the worker cannot run without.
          args=(
            DATABASE_URL="$DATABASE_URL"
            SUPABASE_URL="$SUPABASE_URL"
            SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY"
          )
          # The model keys are optional, and only sent when they exist: pushing
          # an empty secret would look configured in `flyctl secrets list` while
          # behaving as absent, which is the confusing half of both worlds.
          [ -n "${DEEPGRAM_API_KEY:-}" ] && args+=(DEEPGRAM_API_KEY="$DEEPGRAM_API_KEY")
          [ -n "${ELEVENLABS_API_KEY:-}" ] && args+=(ELEVENLABS_API_KEY="$ELEVENLABS_API_KEY")
          [ -n "${GEMINI_API_KEY:-}" ] && args+=(GEMINI_API_KEY="$GEMINI_API_KEY")
          # And the mail provider, optional for the same reason and with a
          # quieter consequence: with neither of these set the sender says so
          # once, at info, and every render still finishes. The worker started
          # needing them the day it began telling people their edit was ready.
          [ -n "${RESEND_API_KEY:-}" ] && args+=(RESEND_API_KEY="$RESEND_API_KEY")
          [ -n "${MAIL_FROM:-}" ] && args+=(MAIL_FROM="$MAIL_FROM")
          # Where the video lives, and whether the sweep may delete any of it.
          #
          # Both are read through an injectable `env` parameter rather than
          # `process.env` directly, which is why they were invisible to the
          # check above and to whoever last read this file: the retention sweep
          # has never run in `on` mode in production, and the object-store seam
          # — the whole point of which is to move this product off Supabase —
          # could not be switched on from here at all. Optional like the keys
          # above, and for the same reason.
          [ -n "${RETENTION_SWEEP:-}" ] && args+=(RETENTION_SWEEP="$RETENTION_SWEEP")
          [ -n "${OBJECT_STORE_PROVIDER:-}" ] && args+=(OBJECT_STORE_PROVIDER="$OBJECT_STORE_PROVIDER")
          [ -n "${OBJECT_STORE_BUCKET:-}" ] && args+=(OBJECT_STORE_BUCKET="$OBJECT_STORE_BUCKET")
          [ -n "${R2_ENDPOINT:-}" ] && args+=(R2_ENDPOINT="$R2_ENDPOINT")
          [ -n "${R2_ACCESS_KEY_ID:-}" ] && args+=(R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID")
          [ -n "${R2_SECRET_ACCESS_KEY:-}" ] && args+=(R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY")
          [ -n "${R2_PUBLIC_BASE:-}" ] && args+=(R2_PUBLIC_BASE="$R2_PUBLIC_BASE")
          # The twelve that make scheduled posting work at all.
          #
          # Every one of them was set on Vercel and none of them here, and the
          # consequence only appears on the day the platform apps are approved:
          # `publisher.ts` refuses every due post with "posting is not switched
          # on for this deployment" — after the customer connected the account
          # successfully five minutes earlier, because *that* half runs on
          # Vercel and works. And `social-token.ts` renews an expiring token
          # with `client_id=""`, which is a 400 nobody reads.
          #
          # Invisible to the check above and to the scanner in `deploy-test`
          # because the worker reads them as `env[spec.clientIdVar]` — the name
          # is data, not a literal. `deploy-test` now asserts this list against
          # `SOCIAL_SPEC` instead, so a seventh platform cannot be added
          # without the deploy learning about it.
          #
          # Optional individually, like the model keys: a deployment with
          # TikTok approved and Snapchat not should ship TikTok rather than
          # wait.
          [ -n "${INSTAGRAM_CLIENT_ID:-}" ] && args+=(INSTAGRAM_CLIENT_ID="$INSTAGRAM_CLIENT_ID")
          [ -n "${INSTAGRAM_CLIENT_SECRET:-}" ] && args+=(INSTAGRAM_CLIENT_SECRET="$INSTAGRAM_CLIENT_SECRET")
          [ -n "${FACEBOOK_CLIENT_ID:-}" ] && args+=(FACEBOOK_CLIENT_ID="$FACEBOOK_CLIENT_ID")
          [ -n "${FACEBOOK_CLIENT_SECRET:-}" ] && args+=(FACEBOOK_CLIENT_SECRET="$FACEBOOK_CLIENT_SECRET")
          [ -n "${TIKTOK_CLIENT_KEY:-}" ] && args+=(TIKTOK_CLIENT_KEY="$TIKTOK_CLIENT_KEY")
          [ -n "${TIKTOK_CLIENT_SECRET:-}" ] && args+=(TIKTOK_CLIENT_SECRET="$TIKTOK_CLIENT_SECRET")
          [ -n "${X_CLIENT_ID:-}" ] && args+=(X_CLIENT_ID="$X_CLIENT_ID")
          [ -n "${X_CLIENT_SECRET:-}" ] && args+=(X_CLIENT_SECRET="$X_CLIENT_SECRET")
          [ -n "${SNAPCHAT_CLIENT_ID:-}" ] && args+=(SNAPCHAT_CLIENT_ID="$SNAPCHAT_CLIENT_ID")
          [ -n "${SNAPCHAT_CLIENT_SECRET:-}" ] && args+=(SNAPCHAT_CLIENT_SECRET="$SNAPCHAT_CLIENT_SECRET")
          [ -n "${YOUTUBE_CLIENT_ID:-}" ] && args+=(YOUTUBE_CLIENT_ID="$YOUTUBE_CLIENT_ID")
          [ -n "${YOUTUBE_CLIENT_SECRET:-}" ] && args+=(YOUTUBE_CLIENT_SECRET="$YOUTUBE_CLIENT_SECRET")
          flyctl secrets set "${args[@]}" --app editly-worker --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.WORKER_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.WORKER_SUPABASE_SERVICE_ROLE_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          # A setting, not a credential — `on` or `dry`, and `dry` is what the
          # code assumes when nobody says.
          RETENTION_SWEEP: ${{ vars.RETENTION_SWEEP }}
          OBJECT_STORE_PROVIDER: ${{ vars.OBJECT_STORE_PROVIDER }}
          OBJECT_STORE_BUCKET: ${{ vars.OBJECT_STORE_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          # The same secrets the Vercel project already has. A client id is not
          # a secret in the strict sense — it travels in the authorise URL —
          # but keeping the pair together means one place to look when a
          # platform stops working.
          INSTAGRAM_CLIENT_ID: ${{ secrets.INSTAGRAM_CLIENT_ID }}
          INSTAGRAM_CLIENT_SECRET: ${{ secrets.INSTAGRAM_CLIENT_SECRET }}
          FACEBOOK_CLIENT_ID: ${{ secrets.FACEBOOK_CLIENT_ID }}
          FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          SNAPCHAT_CLIENT_ID: ${{ secrets.SNAPCHAT_CLIENT_ID }}
          SNAPCHAT_CLIENT_SECRET: ${{ secrets.SNAPCHAT_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

      - name: Deploy
        if: steps.changed.outputs.worker == 'true'
        run: flyctl deploy --config artifacts/worker/fly.toml --dockerfile artifacts/worker/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # How many render machines there are, in version control rather than in
      # somebody's shell history.
      #
      # One render per machine is a measured limit, not a setting — see the
      # memory table in fly.toml — so the only way to render two things at once
      # is to run two machines. This makes that a number anybody can find, and
      # changing it a commit rather than a command nobody remembers running.
      #
      # Default 1, because raising it costs money on somebody's card. Set the
      # repository variable WORKER_COUNT to raise it; the product picks the
      # change up on its own, dividing its wait estimate by however many
      # machines are actually beating.
      - name: Scale to the declared number of machines
        if: steps.changed.outputs.worker == 'true'
        run: |
          set -euo pipefail
          count="${WORKER_COUNT:-1}"
          case "$count" in
            ''|*[!0-9]*) echo "::error::WORKER_COUNT must be a whole number, got '$count'"; exit 1 ;;
          esac
          echo "scaling editly-worker to $count machine(s)"
          flyctl scale count "$count" --app editly-worker --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          WORKER_COUNT: ${{ vars.WORKER_COUNT }}

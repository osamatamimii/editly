openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Editly API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project management
  - name: messages
    description: Chat messages
  - name: exports
    description: Export operations
  - name: stats
    description: Dashboard stats
  - name: subscription
    description: Subscription and plan management
  - name: render
    description: Starting and following an edit
  - name: billing
    description: Checkout configuration and the payment webhook
  - name: account
    description: Changing or ending an account

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: >
        Asks the database what columns it has and compares them to what this
        build reads. It used to answer ok from a constant, and did so throughout
        two days in which every query in the product was failing against a
        database five migrations behind.
      responses:
        "200":
          description: Reachable, and carrying every column this build expects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: >
            The database is unreachable, or behind the migrations. Not 200: a
            monitor reading healthy while the product serves empty screens is
            worse than no monitor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /projects/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List chat messages for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a user message and get AI response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "201":
          description: AI response message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePair"

  /projects/{id}/export:
    post:
      operationId: startExport
      tags: [exports]
      summary: Kick off an export job for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartExportBody"
      responses:
        "202":
          description: Export started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"

  /projects/{id}/export/status:
    get:
      operationId: getExportStatus
      tags: [exports]
      summary: Get export job status for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"

  /subscription:
    get:
      operationId: getSubscription
      tags: [subscription]
      summary: Get current subscription plan and usage
      responses:
        "200":
          description: Subscription details with usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionUsage"
    patch:
      operationId: updateSubscription
      tags: [subscription]
      summary: Update the current subscription plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionBody"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionUsage"

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Ask to be told when it opens
      description: >
        The only public write in the product: the person signing up has no
        account yet, which is the whole point of a waiting list. Rate limited by
        client address rather than by user, because there is no user. The
        address is normalised before storage, and signing up twice is the same
        row and the same friendly answer rather than an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinWaitlistBody"
      responses:
        "201":
          description: On the list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinWaitlistResponse"
        "400":
          description: Not an email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many sign-ups from one address

  /admin/waitlist:
    get:
      operationId: listWaitlist
      tags: [admin]
      summary: Who has asked to be told, newest first
      description: >
        The one screen in the console showing addresses belonging to people who
        are not customers yet — which is why it is here and nowhere else. The
        route that writes this table is public; the route that reads it is the
        most private one in the product.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: The waiting list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListWaitlistResponse"
        "404":
          description: Not an admin, or no such route.

  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: How the platform is doing right now
      description: >
        Operations, not surveillance. Queue health from the same module the
        product uses, the worker's own heartbeat, account and subscription
        counts, the last ten billing events, and minutes rendered this month.
        Answers 404 — not 403 — to any signed-in caller who is not on the
        ADMIN_USER_IDS allowlist, because a status code that confirms the path
        exists is information.
      responses:
        "200":
          description: Platform overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "404":
          description: Not an admin, or no such route. Deliberately the same answer.

  /admin/accounts:
    get:
      operationId: listAdminAccounts
      tags: [admin]
      summary: Who has signed up, and what they have used
      parameters:
        - name: q
          in: query
          required: false
          description: Substring match on the email address.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: A page of accounts, with the real total beside it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdminAccountsResponse"
        "404":
          description: Not an admin, or no such route.

  /admin/jobs:
    get:
      operationId: listAdminJobs
      tags: [admin]
      summary: Recent renders, with their errors as they were written
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [queued, processing, done, failed] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Recent render jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdminJobsResponse"
        "404":
          description: Not an admin, or no such route.

  /admin/actions:
    get:
      operationId: listAdminActions
      tags: [admin]
      summary: What the console has done, and why
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The audit log, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdminActionsResponse"
        "404":
          description: Not an admin, or no such route.

  /admin/jobs/{id}/requeue:
    post:
      operationId: requeueJob
      tags: [admin]
      summary: Put a stuck render back in the queue
      description: >
        Clears the lock a dead worker left behind. Refuses a finished render,
        which would bill the customer twice, and refuses one a live worker is
        holding, because that worker is working rather than stuck.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReasonBody"
      responses:
        "204": { description: Requeued, and written down }
        "400": { description: No reason given }
        "404": { description: Not an admin, or no such job }
        "409": { description: Finished, or held by a live worker }

  /admin/accounts/{userId}/minutes:
    post:
      operationId: grantMinutes
      tags: [admin]
      summary: Hand somebody minutes for this month
      description: >
        The grant is stored as the audit row itself and the meter reads it, so
        there is no path that grants minutes without recording who did it and
        why. It expires with the month, like the plan's own allowance.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantMinutesBody"
      responses:
        "204": { description: Granted, and written down }
        "400": { description: No reason, or minutes out of range }
        "404": { description: Not an admin, or no such route }

  /admin/accounts/{userId}/plan:
    post:
      operationId: setPlanByHand
      tags: [admin]
      summary: Set a plan by hand when the webhook did not
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPlanBody"
      responses:
        "200":
          description: Set, with a warning that Freemius still disagrees
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: { $ref: "#/components/schemas/SubscriptionPlan" }
                  note: { type: string }
                required: [plan, note]
        "400": { description: No reason, or unknown plan }
        "404": { description: Not an admin, or no such route }

  /admin/accounts/{userId}/suspend:
    post:
      operationId: setSuspended
      tags: [admin]
      summary: Stop or restart new renders for an account
      description: >
        Suspension stops new renders and deletes nothing. Every byte, project
        and clip stays, and the person can still sign in and look at their
        work. There is no delete-account action.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSuspendedBody"
      responses:
        "204": { description: Set, and written down }
        "400": { description: No reason, or `suspended` not a boolean }
        "404": { description: Not an admin, or no such route }

  /projects/{id}/render:
    post:
      operationId: startRender
      tags: [render]
      summary: Queue a real edit for this project
      description: >
        Accepts either a plan the caller composed or the id of a saved template.
        Whatever arrives, the server decides what actually runs: the plan's
        watermark, allowance, upload ceiling and export height are applied here
        and nothing the client sends can widen them.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    plan:
                      $ref: "#/components/schemas/EditPlan"
                    fonts:
                      $ref: "#/components/schemas/CaptionFontChoice"
                  required: [plan]
                - type: object
                  properties:
                    templateId:
                      type: string
                    fonts:
                      $ref: "#/components/schemas/CaptionFontChoice"
                  required: [templateId]
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"
        "402":
          description: The plan does not include something the request needs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This project already has a render in flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The source is longer than this plan accepts in one upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The month's allowance is used up, or this clip would exceed it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/render/status:
    get:
      operationId: getRenderStatus
      tags: [render]
      summary: The most recent render for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The render, or null if the project has never been rendered
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RenderJob"
                  - type: "null"

  /templates:
    get:
      operationId: listTemplates
      tags: [render]
      summary: The saved looks a render can be started from
      description: >
        A template is a saved edit plan, resolved on the server so the numbers
        behind a named look live in one place and the result is identical every
        time.
      responses:
        "200":
          description: Available templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /billing/checkout:
    get:
      operationId: getCheckoutConfig
      tags: [billing]
      summary: What the browser needs to open a checkout
      description: >
        Public identifiers only. The secret key never leaves the server, because
        it is the only thing preventing anyone from forging a payment.
      responses:
        "200":
          description: Checkout configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutConfig"

  /billing/webhook:
    post:
      operationId: billingWebhook
      tags: [billing]
      summary: Freemius calls this when a payment changes
      description: >
        Deliberately unauthenticated in the session sense: it is called from the
        open internet with no token. Its authentication is an HMAC-SHA256
        signature over the raw request body, verified with a constant-time
        compare. Events we do not recognise are answered 200 rather than
        guessed at.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Accepted, or recognised and ignored
        "401":
          description: The signature did not verify
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Remove everything belonging to this account
      description: >
        The videos, the projects, the conversation, the render history and the
        login. Either it happens or it is refused — never partial and reported
        as complete. Job rows survive on purpose: minutes that were produced
        were produced, and cascading them would make deleting projects a way to
        reset the meter.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletion"
        "503":
          description: >
            Refused. The credentials needed to reclaim stored video are not
            configured, and nothing was touched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: The files this project can put on screen
      description: >
        Everything besides the one video being cut — b-roll, a screenshot, a
        logo, music. The storage path is deliberately absent from the response:
        the browser already knows where it put a file, and echoing paths back
        turns any future enumeration bug into a data leak.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The project's library, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "404":
          description: >
            No such project, or not this account's. The same answer for both, so
            that whether an id exists is not learnable from a status code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: registerAsset
      tags: [assets]
      summary: Record a file the browser has already uploaded
      description: >
        The bytes go straight from the browser to Storage under the signed-in
        user's own session. This records where they landed — and refuses to
        believe the claim unless the path is inside this user's folder for this
        project.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAssetBody"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: The path is not inside this project's folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The project already holds as many files as it may
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clips:
    get:
      operationId: listAllClips
      tags: [clips]
      summary: Every clip this account owns, across every recording
      description: >
        The per-project route answers "what came out of this take", which is
        what an editor asks. This answers "what have I got to post", which is
        what somebody recording a weekly show asks - and their clips live in
        eleven projects, so the output of the thing they use this product for
        was scattered across the screens they used to make it. Each row carries
        the title of the recording it came from: a wall of clips titled by what
        was said in them, with no way to tell which take each belongs to, is a
        pile rather than a library.
      responses:
        "200":
          description: Every clip, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  clips:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Clip"
                        - type: object
                          properties:
                            projectTitle:
                              type: string
                          required: [projectTitle]
                  # How many this account has, which is not always how many are
                  # in the array. The list is capped, and a cap that says
                  # nothing is a library that quietly stops at 200 - the person
                  # sees the newest and no sign that the rest exist.
                  total:
                    type: integer
                required: [clips, total]

  /social/platforms:
    get:
      operationId: listSocialPlatforms
      tags: [social]
      summary: Which platforms this deployment can post to
      description: >
        The same answer for everybody: what the *deployment* holds credentials
        for, not what this person has connected. Posting on somebody's behalf
        needs an app the platform has reviewed, which takes days and is not
        code - so the product says which platforms are switched on rather than
        showing a Connect button that cannot work. No secret ever appears here;
        the answer is a boolean per platform and the limits that platform
        enforces.
      responses:
        "200":
          description: The five platforms, and whether each is usable
          content:
            application/json:
              schema:
                type: object
                properties:
                  platforms:
                    type: array
                    items:
                      $ref: "#/components/schemas/SocialPlatform"
                required: [platforms]

  /social/accounts:
    get:
      operationId: listSocialAccounts
      tags: [social]
      summary: The accounts this person has connected
      description: >
        Never the token. Every read of the accounts table names its columns,
        because `select()` with no argument on that table is the bug that hands
        a credential to a browser - and it is the kind that gets added in a
        hurry by somebody adding an endpoint. What comes back is the handle,
        the platform, and whether the connection still works.
      responses:
        "200":
          description: The connected accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/SocialAccount"
                required: [accounts]

  /social/accounts/{id}:
    delete:
      operationId: disconnectSocialAccount
      tags: [social]
      summary: Disconnect an account
      description: >
        Scheduled posts to that account are cancelled rather than deleted, and
        the count comes back so it can be said out loud. Silently dropping a
        week of scheduling means the first somebody knows is a post that never
        appeared.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Disconnected, and how many scheduled posts went with it
          content:
            application/json:
              schema:
                type: object
                properties:
                  disconnected:
                    type: boolean
                  cancelledPosts:
                    type: number
                required: [disconnected, cancelledPosts]
        "404":
          description: Not connected, or not this account's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /social/posts:
    get:
      operationId: listScheduledPosts
      tags: [social]
      summary: What is scheduled, and what happened to what has gone
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: >
            What has not gone out yet, soonest first, then history newest
            first. Capped; `total` is how many there are, which is not always
            how many were sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduledPost"
                  total: { type: integer }
                required: [posts, total]
    post:
      operationId: schedulePosts
      tags: [social]
      summary: Schedule one edit to one or more accounts
      description: >
        One request, several rows - and either all of them are written or none
        is. Every destination is checked against its platform's rules first,
        and the whole request is refused with the reasons, per platform, if any
        of them cannot go. A partial success is the worst answer available:
        told "scheduled", three went out, and the fourth is missing with
        nothing anywhere saying so.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId: { type: string }
                exportId: { type: string }
                accountIds:
                  type: array
                  items: { type: string }
                caption: { type: string }
                hashtags:
                  type: array
                  items: { type: string }
                captions:
                  description: >
                    Per-platform overrides. The same clip wants different words
                    on a platform with a 280-character limit than on one that
                    reads hashtags.
                  type: object
                  additionalProperties: { type: string }
                scheduledFor:
                  type: string
                  format: date-time
              required: [projectId, accountIds, scheduledFor]
      responses:
        "201":
          description: Scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  scheduled:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        platform: { type: string }
                      required: [id, platform]
                required: [scheduled]
        "400":
          description: >
            Nothing was written. `refusals` names each destination that cannot
            take this as written, and why, so all of them can be fixed at once
            rather than one round trip at a time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  refusals:
                    type: array
                    items:
                      type: object
                      properties:
                        accountId: { type: string }
                        handle: { type: string }
                        platform: { type: string }
                        message: { type: string }
                      required: [accountId, handle, platform, message]
                required: [error]
        "404":
          description: No such project or account, or not this account's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /social/posts/{id}:
    delete:
      operationId: cancelScheduledPost
      tags: [social]
      summary: Call a post back before it goes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: boolean }
                required: [cancelled]
        "409":
          description: >
            Already gone, or going now. A post the worker is holding cannot be
            cancelled here without the two of us disagreeing about whether it
            went out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/clips:
    get:
      operationId: listClips
      tags: [clips]
      summary: The pieces clips renders have cut from this project's video
      description: >
        Newest set first, source order within a set. Each clip is its own
        artifact with its own storage path, which the browser signs into a
        playback URL with its own session - the same way it plays everything
        else this project owns.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The project's clips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Clip"
        "404":
          description: >
            No such project, or not this account's. The same answer for both, so
            that whether an id exists is not learnable from a status code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/clips/{clipId}:
    delete:
      operationId: deleteClip
      tags: [clips]
      summary: Delete one clip the person decided against keeping
      description: >
        Removes the row, then makes an immediate best-effort attempt on the
        master file and its preview mirror - a failure there leaves orphan
        bytes that deleting the project reclaims, never a row pointing at a
        file that is gone. Scoped by user, project and clip; a guessed id
        gets the same 404 as one that never existed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: clipId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: No such clip in this project for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/clips/{clipId}/open:
    post:
      operationId: openClipAsProject
      tags: [clips]
      summary: Open one clip as a project of its own
      description: >
        Makes a new project whose source video is a copy of this clip, so a
        piece the worker cut can be edited, captioned and rendered like any
        other upload instead of being a download-only dead end. The bytes are
        copied rather than shared: every object in this bucket belongs to
        exactly one project prefix, and two rows owning one file would mean
        the first deletion broke the second project. If the copy fails the
        new project row is removed again, so a project never points at a file
        that is not there. Nothing about the clip or its own project changes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: clipId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: The new project, ready to open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: No such clip in this project for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >
            This deployment cannot copy stored video, so the clip cannot be
            opened as a project. Refused rather than answered with a project
            that would not play.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/assets/{assetId}:
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Remove one file from the project's library
      description: >
        Scoped by user and project and asset together, so an id guessed from
        another account deletes nothing. The stored object is left alone: a
        per-asset delete that half-succeeds leaves a row pointing at nothing,
        and deleting the project reclaims the whole folder in one call.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          description: No such asset in this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/search:
    get:
      operationId: searchStock
      tags: [stock]
      summary: Search the stock library
      description: >
        Free clips and photography, searched through us so the key never reaches
        the browser. With no key configured this answers 503 rather than an
        empty list — "we have not switched this on" and "there are no photos of
        cats" are different answers.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [image, video]
            default: image
      responses:
        "200":
          description: What the library has
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StockItem"
                required: [items]
        "400":
          description: The search term is too short or too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The stock provider did not answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No stock key is configured for this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/preview/{id}:
    get:
      operationId: getStockPreview
      tags: [stock]
      summary: Stream the small rendition, for looking rather than keeping
      description: >
        The same resolution and allowlist as the download, applied to the
        smallest file the provider offers. Same origin on purpose: no dependency
        on a third party's CORS or uptime, and nothing for a blocker to remove.
        Cached for an hour — a clip someone scrolls back to should not be
        fetched twice. It does not make an undecodable clip decodable: a browser
        without H.264 plays neither the provider's copy nor ours, and the panel
        says so rather than spinning.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^(photo|video):[0-9]{1,15}$"
      responses:
        "200":
          description: The small rendition
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: That is not a stock id, or there is nothing small to send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The provider refused the file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No stock key is configured for this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/file/{id}:
    get:
      operationId: getStockFile
      tags: [stock]
      summary: Stream one stock file
      description: >
        The id is resolved by the provider and the resulting URL is checked
        against an allowlist before a byte is fetched — the client never names a
        file, because a client-supplied URL is a server-side request forgery.
        Streamed rather than buffered, and capped on the way through.
      parameters:
        - name: id
          in: path
          required: true
          description: A namespaced stock id, "photo:123" or "video:456".
          schema:
            type: string
            pattern: "^(photo|video):[0-9]{1,15}$"
      responses:
        "200":
          description: >
            The file. Its kind, label, dimensions and duration come back as
            X-Stock-* headers so the caller can register it without a second
            round trip and without inventing any of it.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: That is not a stock id, or the provider does not have it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Larger than we will pass through
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The provider refused the file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No stock key is configured for this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fonts:
    get:
      operationId: listUploadedFonts
      tags: [fonts]
      summary: The fonts this person has uploaded
      description: >
        Including the ones that were refused, with the reason, in the language
        of the request. A font that cannot be used is more useful to show than
        to hide - "rejected" with nothing after it produces a support message
        instead of a second upload.
      responses:
        "200":
          description: Every face this person owns, ready or not
          content:
            application/json:
              schema:
                type: object
                properties:
                  faces:
                    type: array
                    items:
                      $ref: "#/components/schemas/UploadedFace"
                required: [faces]

    post:
      operationId: registerUploadedFont
      tags: [fonts]
      summary: Register a font the browser has already uploaded
      description: >
        The bytes never pass through here. The browser uploads to Storage with
        its own session, exactly as it does for video and images, and this
        records where. Two claims are refused rather than believed - where the
        file is, checked against the signed-in user; and what it is, which is
        not decided here at all. Whether those bytes are a font, whether it
        draws anything, and what its three numbers are, is settled by rendering
        with it on the machine that will burn with it. A serverless function
        has no libass and could only guess.


        So the answer is 202 and not 201. The row exists; the font is not
        usable yet, and a status meaning "created" would be describing
        something that has not finished.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterFontRequest"
      responses:
        "202":
          description: Recorded, and queued to be prepared and measured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFace"
        "200":
          description: This exact file was already registered; the existing face is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFace"
        "400":
          description: Not a path this account can write to, or a malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This account is already holding as many fonts as it may
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many fonts registered too quickly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fonts/{id}:
    delete:
      operationId: deleteUploadedFont
      tags: [fonts]
      summary: Remove an uploaded font
      description: >
        The row goes. The objects are left for the storage sweep - an edit
        already rendered with this face is not re-rendered, so nothing is
        served from those bytes once the row is gone, and three calls that can
        each fail halfway is a worse thing to put behind a small close button
        than a few hundred unreferenced kilobytes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          description: No such font for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads:
    post:
      operationId: authoriseUpload
      tags: [uploads]
      summary: Ask where a file may go, before sending it
      description: >
        The step that puts this API back on the path of an upload. The browser
        says what it is about to send; the server decides where it goes and
        whether it may go at all, and answers with a key it chose, the content
        type it settled, the ceiling it measured against and a URL it signed.


        Four things are checked here and every one of them before anything is
        signed - that the project belongs to the caller, that the shelf it is
        going on is not already full, that the type is one this product holds,
        and that the size is inside the smaller of the bucket's ceiling and
        this product's own for the purpose. Each refusal carries a sentence and
        leaves a line in the log with a reason code. Before this endpoint every
        one of those refusals came from Storage, to a browser, on a request no
        log here recorded.


        The storage key is not in the request and never was: it is built from
        the verified user id, so another account's folder is unspellable rather
        than merely rejected.


        The transfer comes back in one of two shapes. "signed" is a URL this
        API minted and carries no credential of ours. "resumable" is the tus
        endpoint, used for a file large enough that starting again from zero
        would cost somebody their upload - Supabase's resumable endpoint has no
        signed form, so that transfer still carries the person's own session
        while every decision about it was made here. A provider whose multipart
        upload can be signed per part never answers with this mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  enum: [source, asset, reference, thumbnail, font]
                  description: >
                    What the file is for, which is what decides the key, the
                    ceiling and the types that are acceptable.
                filename:
                  type: string
                  description: >
                    Used for the content type and the extension and nothing
                    else. It never becomes part of the key.
                bytes:
                  type: integer
                projectId:
                  type: string
                  description: Required by every purpose except a font, which belongs to the person.
              required: [purpose, filename, bytes]
      responses:
        "201":
          description: Authorised, with somewhere to send the bytes
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                    description: The storage key, chosen here. What the browser reports back afterwards.
                  contentType:
                    type: string
                  maxBytes:
                    type: integer
                    description: The ceiling this was measured against, so the screen can name a real number.
                  expiresAt:
                    type: string
                  transfer:
                    type: object
                    description: Either a signed URL, or the resumable endpoint and the metadata to create with.
                    properties:
                      mode:
                        type: string
                        enum: [signed, resumable]
                      url:
                        type: string
                      method:
                        type: string
                        enum: [PUT, POST]
                      headers:
                        type: object
                        additionalProperties:
                          type: string
                      metadata:
                        type: object
                        additionalProperties:
                          type: string
                    required: [mode, url, headers]
                required: [path, contentType, maxBytes, expiresAt, transfer]
        "400":
          description: A type this product cannot use, a purpose with no project, or a body that could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such project for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The project or the account is already holding as many files as it may
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Larger than the ceiling that was actually applied, which the sentence names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many uploads started too quickly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >
            Storage is not configured, or would not sign. Not a 400 - a person
            told their file is the problem will spend the afternoon trying
            smaller ones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /social/connect/{platform}:
    post:
      operationId: startSocialConnection
      tags: [social]
      summary: Begin connecting an account on a platform
      description: >
        Returns the URL to send somebody to, rather than redirecting to it. The
        browser reaches every route in this API with an `Authorization` header,
        and `fetch` follows a 302 with that header still attached - so a
        redirecting endpoint would hand this person's Editly bearer token to
        Facebook. The page opens the URL itself.


        For the two platforms that require PKCE the verifier is set as an
        httpOnly cookie here and read back in the callback. It never appears on
        a URL, which is the whole point of PKCE: a verifier in a query string
        has been seen by the browser's history, the referrer, and every proxy
        on the path.
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [instagram, facebook, tiktok, x, snapchat, youtube]
      responses:
        "200":
          description: Where to send the person
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                required: [url]
        "404":
          description: No such platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: This deployment holds no credentials for that platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /social/callback/{platform}:
    get:
      operationId: finishSocialConnection
      tags: [social]
      summary: Where the platform sends somebody back
      description: >
        Not an API call: a browser navigation from the platform, carrying no
        bearer token and unable to carry one. It is therefore the one route
        under /api that is not behind authentication, and who the connection
        belongs to comes from the signed state on the URL instead.


        That state is the security of this whole flow. An OAuth callback is a
        plain GET anybody can cause; without a state bound to the signed-in
        person, an attacker sends their own code here and a victim's account is
        connected to the attacker's feed, after which everything that person
        schedules is published to a stranger. The state is an HMAC over the
        user, the platform and an expiry, and every kind of bad state is
        refused with the same sentence - a reply that said which part was wrong
        would be an oracle for building one that is not.


        Always answers with a redirect to /scheduled, carrying the outcome on
        the query string, because a person staring at a blank page after
        signing in to Instagram has no idea whether it worked.
      security: []
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Back to the scheduling page, with the outcome on the query string

  /admin/deployment:
    get:
      operationId: adminDeployment
      tags: [admin]
      summary: Where this deployment disagrees with the code running on it
      description: >
        Read-only, and it exists because of two bugs found in one night that no
        test could have caught: the storage bucket refused image/png and
        audio/mpeg while the app offered both, and the extra-files panel
        promised 512 MB against a 50 MB bucket. Both were invisible from the
        server's side by construction - the browser talks to Storage directly,
        gets a 400, and this API is never called.


        Every finding names what the code assumes and what the deployment
        actually does, never merely that they differ, because "mismatch" is a
        line somebody scrolls past. Anything that could not be checked comes
        back as `unknown` rather than `ok`: a green tick for a question nobody
        asked is the failure this endpoint is a response to.


        It also carries what is stored and what renders have pulled out of
        storage this month, both measured rather than estimated - egress is the
        largest line on a video product's bill and the one number that differs
        by two orders of magnitude between object stores.
      responses:
        "200":
          description: Findings, a count of each verdict, and this month's usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        verdict: { type: string, enum: [ok, wrong, unknown] }
                        expected: { type: string }
                        actual: { type: string }
                        consequence: { type: string }
                      required: [id, verdict, expected, actual, consequence]
                  summary:
                    type: object
                    properties:
                      wrong: { type: integer }
                      unknown: { type: integer }
                      ok: { type: integer }
                    required: [wrong, unknown, ok]
                  usage:
                    type: object
                    properties:
                      storedBytes: { type: integer, nullable: true }
                      objects: { type: integer, nullable: true }
                      egressBytes: { type: integer }
                      measuredRenders: { type: integer }
                      unmeasuredRenders: { type: integer }
                    required: [storedBytes, objects, egressBytes, measuredRenders, unmeasuredRenders]
                required: [findings, summary, usage]
        "404":
          description: Not an admin on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      description: The project's id. Ownership is checked on every route that takes it.
      schema:
        type: string

  schemas:
    # Three states, not a boolean, because they are three different jobs for
    # whoever is reading: nothing, run the migrations, check the connection.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, behind, unreachable]
        database:
          type: object
          properties:
            reachable:
              type: boolean
            missingColumns:
              description: >
                Qualified as table.column. Populated when the database is behind
                the migrations this build expects — naming them turns the fix
                from an afternoon of stack traces into a minute.
              type: array
              items:
                type: string
          required: [reachable, missingColumns]
        capabilities:
          description: >
            Which optional parts of the product this deployment actually has.
            Booleans only — never a key name and never a key value, because this
            endpoint is public. It exists because the recurring question has not
            been "is the server up" but "is the thing we built switched on", and
            that was otherwise only answerable by reading a dashboard or waiting
            for a customer to hit a 503.
          type: object
          properties:
            storageAdmin:
              description: >
                Reclaiming stored video is configured. Account deletion is
                refused while this is false, because removing the rows without
                the bytes is an orphaning dressed up as a deletion.
              type: boolean
            storageCheck:
              description: >
                Whether that key actually authenticates — asked of Storage with
                a list against a prefix that matches nothing, and cached, so a
                public endpoint cannot be turned into a load generator. A
                present-but-wrong key is indistinguishable from a right one
                until a customer asks to delete their account.
              type: string
              enum: [ok, unauthorized, unreachable, not-configured]
            planner:
              description: >
                A model choosing the operations. Without it the keyword matcher
                does, which is worse and honest about being worse.
              type: boolean
            stockLibrary:
              type: boolean
            billing:
              description: Without it the payment webhook refuses every request.
              type: boolean
            admins:
              description: >
                Whether anyone is on the operations console's allowlist. A
                boolean, never the ids and never the count: the only question it
                answers is whether ADMIN_USER_IDS reached this deployment,
                because a console that answers 404 to its own owner looks
                identical whether the list is missing, empty, or does not name
                them.
              type: boolean
          required: [storageAdmin, storageCheck, planner, stockLibrary, billing, admins]
        worker:
          description: >
            Whether a machine that can actually render is listening. Everything
            else here describes the API; this describes the product — with no
            worker beating, every render queues and none starts while the API
            keeps answering 200, which is the shape of the 12 August outage that
            ran for two days. Reported rather than turned into a 503 on purpose:
            a dead worker is not a broken API, and the two send you to different
            places. `.github/workflows/watch.yml` reads it every fifteen minutes
            and fails the run when it is false, which is the alert.
          type: object
          properties:
            online:
              type: boolean
            lastSeenAgoSeconds:
              description: >
                Whole seconds since the last beat, or null when there has never
                been one — offline with an age is a machine that stopped,
                offline with no age is one that was never there.
              type: integer
              nullable: true
          required: [online, lastSeenAgoSeconds]
        signIn:
          description: >
            Which ways of signing in are switched on for this project. Not a
            health signal — email sign-in is a complete product and Google being
            off breaks nothing. It is here because turning Google on is four
            steps across two dashboards and every one of them fails the same way
            from the outside: you click "Continue with Google", you go away, you
            come back to a login form. This makes "is it on in production" a
            question with an answer, from anywhere, without an account.
          type: object
          properties:
            google:
              type: boolean
            apple:
              type: boolean
            known:
              description: >
                Whether the answer above is an answer. False when Supabase could
                not be asked, and then the providers are false too — meaning "we
                do not know", not "they are off". Reporting the second when it
                means the first sends somebody to re-enter credentials that were
                already correct.
              type: boolean
          required: [google, apple, known]
        message:
          type: string
      required:
        - status
        - database

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Project:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [uploading, ready, processing, done, failed]
        thumbnailUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        editedVideoUrl:
          type: ["string", "null"]
        videoPath:
          description: Storage object key for the uploaded source video.
          type: ["string", "null"]
        editedVideoPath:
          description: Storage object key for the rendered output, once one exists.
          type: ["string", "null"]
        thumbnailPath:
          description: Storage object key for the poster frame.
          type: ["string", "null"]
        referenceVideoPath:
          description: >
            Storage object key of a video whose look this project should match.
            Uploaded, never fetched from a link.
          type: ["string", "null"]
        duration:
          type: ["number", "null"]
        width:
          description: Source video width in pixels, measured at upload.
          type: ["integer", "null"]
        height:
          description: Source video height in pixels, measured at upload.
          type: ["integer", "null"]
        editedWidth:
          description: >
            Edited output width in pixels, measured by the worker from the file
            it produced. Null until a render has finished.
          type: ["integer", "null"]
        editedHeight:
          description: Edited output height in pixels, measured by the worker.
          type: ["integer", "null"]
        platform:
          type: ["string", "null"]
          enum: [tiktok, reels, shorts, youtube, square, null]
        renderStalled:
          description: The render is queued but no worker has claimed it.
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - title
        - status
        - thumbnailUrl
        - videoUrl
        - editedVideoUrl
        - videoPath
        - editedVideoPath
        - thumbnailPath
        - referenceVideoPath
        - duration
        - width
        - height
        - editedWidth
        - editedHeight
        - platform
        - renderStalled
        - createdAt
        - updatedAt

    CreateProjectBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    UpdateProjectBody:
      type: object
      properties:
        title:
          type: string
        status:
          type: string
          enum: [uploading, ready, processing, done, failed]
        thumbnailUrl:
          type: string
        videoUrl:
          type: string
        editedVideoUrl:
          type: string
        videoPath:
          type: string
        editedVideoPath:
          type: string
        thumbnailPath:
          type: string
        duration:
          type: number
        width:
          type: integer
        height:
          type: integer
        platform:
          type: string
          enum: [tiktok, reels, shorts, youtube, square]

    Message:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
      required:
        - id
        - projectId
        - role
        - content
        - createdAt

    SendMessageBody:
      type: object
      properties:
        content:
          type: string
        fonts:
          $ref: "#/components/schemas/CaptionFontChoice"
      required:
        - content

    CaptionFontChoice:
      description: >-
        Which caption faces to draw with, by id from lib/api-zod/src/fonts.ts.
        One per script, because a caption track can carry both and each needs
        its own. Attached to the request rather than to the plan: a plan reaches
        the queue three ways and this is a person's preference, not a property
        of any of them. An unknown id resolves to the default rather than
        failing validation.
      type: object
      properties:
        latin:
          type: string
        arabic:
          type: string

    MessagePair:
      type: object
      properties:
        userMessage:
          $ref: "#/components/schemas/Message"
        aiMessage:
          $ref: "#/components/schemas/Message"
      required:
        - userMessage
        - aiMessage

    ExportJob:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        status:
          type: string
          enum: [pending, processing, done, failed]
        platform:
          type: string
          enum: [tiktok, reels, shorts, youtube, square]
        downloadUrl:
          type: ["string", "null"]
        # The storage key this export produced, which the browser signs for
        # itself. It travels with the status it belongs to rather than being
        # read off the project, whose `editedVideoPath` is a cache of the
        # newest render — a copy fetched before this export existed once handed
        # people their original upload under a card saying the edit was ready.
        outputPath:
          type: ["string", "null"]
        # How long the finished edit is, measured by the worker from the file
        # it produced — not the source length.
        #
        # The scheduling screen judges a post against the platforms' duration
        # limits, and the only number it had was the *upload's*. An edit is
        # almost always shorter than the take it came from, so a three-minute
        # recording cut to ninety seconds was refused for X on a limit it does
        # not break. That failure is invisible: nothing errors, the person
        # simply cannot post something that would have been fine.
        outputSeconds:
          type: ["number", "null"]
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ExportStep"
        # What the render did that the person should know about: captions
        # skipped for want of a key, punches dropped because the words they
        # landed on were cut, words the two speech models disagreed on. A
        # render that quietly did less than it was asked to, and looks
        # identical to one that did everything, is the failure this product is
        # built against.
        notes:
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - projectId
        - status
        - platform
        - downloadUrl
        - steps
        - createdAt
        - updatedAt

    ExportStep:
      type: object
      properties:
        label:
          type: string
        status:
          type: string
          enum: [pending, active, done]
      required:
        - label
        - status

    StartExportBody:
      type: object
      properties:
        platform:
          type: string
          enum: [tiktok, reels, shorts, youtube, square]
      required:
        - platform

    SubscriptionPlan:
      type: string
      enum: [free, creator, pro, studio]

    # The meter is minutes of finished video, not videos: counting videos
    # charged the same for a nine-second hook and a ninety-minute episode.
    # maxUploadMinutes is here because it is what actually separates the tiers.
    SubscriptionUsage:
      type: object
      properties:
        plan:
          $ref: "#/components/schemas/SubscriptionPlan"
        minutesGranted:
          description: Of minutesIncluded, how much was granted by hand this month rather than paid for.
          type: number
        minutesIncluded:
          type: number
        minutesUsedThisMonth:
          type: number
        minutesRemaining:
          type: number
        maxUploadMinutes:
          type: number
        maxUploadBytes:
          type: number
          description: >-
            The ceiling Storage actually enforces, read from the bucket. Our
            rule is `maxUploadMinutes`; this one is somebody else's, and on
            Supabase's free plan it is 50 MB per object. Sent rather than
            compiled into the front end so that changing the plan does not need
            a redeploy before uploads stop being refused for a limit that no
            longer exists.
        watermark:
          type: boolean
        referenceStyle:
          type: boolean
        pricePerMonth:
          type: number
      required:
        - plan
        - minutesIncluded
        - minutesUsedThisMonth
        - minutesRemaining
        - maxUploadMinutes
        - maxUploadBytes
        - watermark
        - referenceStyle
        - pricePerMonth

    UpdateSubscriptionBody:
      type: object
      properties:
        plan:
          $ref: "#/components/schemas/SubscriptionPlan"
      required:
        - plan

    # Whether anything is listening, and what it can do. The queue can say a
    # render is stuck; it cannot say whether a worker exists — not for the first
    # five minutes, and not at all when nothing is queued. The worker's id is
    # deliberately absent: it carries a hostname and answers nobody's question.
    WorkerStatus:
      type: object
      properties:
        online:
          type: boolean
        lastSeenAt:
          type: ["string", "null"]
        transcription:
          description: The model's name, never a key. Null when none is configured.
          type: ["string", "null"]
        vision:
          type: ["string", "null"]
      required: [online, lastSeenAt, transcription, vision]

    DashboardStats:
      type: object
      properties:
        totalProjects:
          type: number
        processingCount:
          description: Renders a worker is actually working on.
          type: number
        stalledCount:
          description: Renders queued with no worker to run them.
          type: number
        doneCount:
          type: number
        recentProjects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        worker:
          $ref: "#/components/schemas/WorkerStatus"
      required:
        - totalProjects
        - processingCount
        - stalledCount
        - doneCount
        - recentProjects
        - worker

    # ── What a render is ──────────────────────────────────────────────────────

    # An operation is a decision, not a filter setting. Each carries only the
    # numbers a person would argue about; everything else the renderer derives,
    # so that the same plan against the same video always produces the same file.
    EditOperation:
      oneOf:
        - $ref: "#/components/schemas/RemoveSilenceOperation"
        - $ref: "#/components/schemas/TightenOperation"
        - $ref: "#/components/schemas/ExtractHighlightOperation"
        - $ref: "#/components/schemas/ExtractRangeOperation"
        - $ref: "#/components/schemas/ExtractClipsOperation"
        - $ref: "#/components/schemas/ColdOpenOperation"
        - $ref: "#/components/schemas/FadeOperation"
        - $ref: "#/components/schemas/TransitionOperation"
        - $ref: "#/components/schemas/FormatForPlatformOperation"
        - $ref: "#/components/schemas/BurnCaptionsOperation"
        - $ref: "#/components/schemas/AutoCaptionsOperation"
        - $ref: "#/components/schemas/WatermarkOperation"
        - $ref: "#/components/schemas/KenBurnsOperation"
        - $ref: "#/components/schemas/ZoomPunchOperation"
        - $ref: "#/components/schemas/NormalizeLoudnessOperation"
        - $ref: "#/components/schemas/GradeOperation"
        - $ref: "#/components/schemas/InsertBRollOperation"
        - $ref: "#/components/schemas/AddMusicOperation"
        - $ref: "#/components/schemas/OverlayImageOperation"
        - $ref: "#/components/schemas/MotionTitleOperation"
      discriminator:
        propertyName: type

    Asset:
      description: >
        One file in a project's library. The storage path is deliberately not a
        property: the browser knows where it put the file and can sign its own
        URL, and a path in a response is a path in a future leak.
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        kind:
          type: string
          enum: [video, image, audio]
        label:
          type: string
          nullable: true
        bytes:
          type: integer
          minimum: 0
        durationSeconds:
          type: number
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        url:
          description: Always null. Present so the shape does not change later.
          type: string
          nullable: true
      required: [id, projectId, kind, bytes, createdAt]

    RegisterAssetBody:
      type: object
      properties:
        path:
          description: >
            Where the browser put the file. Checked against this user and this
            project before it is believed; every segment must be made of
            characters that cannot mean anything but themselves, so a traversal
            is unspellable rather than merely rejected.
          type: string
        kind:
          type: string
          enum: [video, image, audio]
        label:
          type: string
          nullable: true
        bytes:
          type: integer
          minimum: 0
        durationSeconds:
          type: number
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
      required: [path, kind, bytes]

    StockItem:
      description: >
        One result from the stock library. The id is namespaced — "photo:123" —
        because the provider's photo and video id spaces overlap, and because a
        client that can only name an id cannot name an internal address.
      type: object
      properties:
        id:
          type: string
          pattern: "^(photo|video):[0-9]{1,15}$"
        kind:
          type: string
          enum: [image, video]
        label:
          type: string
        previewUrl:
          description: A thumbnail, safe to put in a grid. Videos get a poster frame.
          type: string
          format: uri
        viewUrl:
          description: >
            A bigger still, for looking at one properly before committing to it.
          type: string
          format: uri
        playable:
          description: >
            Whether there is a clip to play. The bytes come from
            /stock/preview/{id} rather than from a URL in this object, so a
            preview depends on neither a third party's CORS nor its uptime.
            Whether it then decodes is the browser's business: one without H.264
            shows the poster frame and a line saying so.
          type: boolean
        width:
          type: integer
        height:
          type: integer
        durationSeconds:
          type: number
          nullable: true
        credit:
          description: The photographer. Carried into the asset's label, as the provider asks.
          type: string
        creditUrl:
          type: string
          format: uri
      required: [id, kind, label, previewUrl, viewUrl, width, height, credit, creditUrl]

    AddMusicOperation:
      description: >
        Lay a music bed under the whole edit, from a track already in this
        project's library. There is no catalogue here and there will not be
        one: a track we handed out would be a licence bought on the customer's
        behalf. Unlike every other operation this one carries no `at` — a bed
        runs the length of the finished edit by definition, so it is the one
        thing placed on the output clock rather than the source clock.
      type: object
      properties:
        type:
          type: string
          enum: [addMusic]
        assetId:
          description: >
            Must name an audio file already in this project. Checked against
            the kind as well as the id: a video file here is a plan asking to
            play a picture as a song.
          type: string
        gainDb:
          description: >
            How far under the programme the bed sits. -18 dB is a bed you feel
            and stop hearing; 0 puts the music level with the voice.
          type: number
          minimum: -40
          maximum: 0
          default: -18
        duck:
          description: >
            Pull the music down while someone is speaking and let it back up in
            the gaps. On a clip with no speech there is nothing to duck under,
            and the render note says so rather than claiming it happened.
          type: boolean
          default: true
        fadeSeconds:
          description: >
            The bed's own fade in and out, shortened to a third of the edit on a
            clip too short to carry the whole of it.
          type: number
          minimum: 0
          maximum: 5
          default: 1.5
        fromSeconds:
          description: Start the track past its intro rather than at its first second.
          type: number
          minimum: 0
          maximum: 3600
          default: 0
        loop:
          description: Repeat the track if it runs out before the edit does.
          type: boolean
          default: true
      required: [type, assetId]

    InsertBRollOperation:
      description: >
        Cut away to one of the project's own clips, keeping the speaker's audio
        underneath — a cutaway that silences them is not a cutaway, it is a cut.
      type: object
      properties:
        type:
          type: string
          enum: [insertBRoll]
        assetId:
          description: >
            Must name a video already in this project. The planner is offered
            only the ids that exist, and the answer is checked against the kind
            as well: an image here would not be a wrong edit, it would be a
            crash.
          type: string
        at:
          description: Seconds into the finished video, after any cuts.
          type: number
          minimum: 0
        durationSeconds:
          type: number
          minimum: 0.2
          maximum: 30
          default: 3
        fit:
          description: >
            cover fills the frame and crops the overflow, which is right for
            footage; contain letterboxes, which is right for a screenshot where
            cropping the edges destroys the point of showing it.
          type: string
          enum: [cover, contain]
          default: cover
        keepSourceAudio:
          type: boolean
          default: true
      required: [type, assetId, at]

    OverlayImageOperation:
      description: Hold one of the project's images over the frame.
      type: object
      properties:
        type:
          type: string
          enum: [overlayImage]
        assetId:
          type: string
        at:
          type: number
          minimum: 0
        durationSeconds:
          type: number
          minimum: 0.2
          maximum: 60
          default: 3
        position:
          type: string
          enum:
            [
              top-left,
              top-center,
              top-right,
              center,
              bottom-left,
              bottom-center,
              bottom-right,
            ]
          default: center
        scale:
          description: Fraction of the frame's width. 0.4 is a comfortable inset graphic.
          type: number
          minimum: 0.05
          maximum: 1
          default: 0.4
        opacity:
          type: number
          minimum: 0.05
          maximum: 1
          default: 1
      required: [type, assetId, at]

    MotionTitleOperation:
      description: >
        Words animated onto the screen, rendered in a real browser frame by
        frame so the easing is a spring rather than a bezier's approximation of
        one. The text is the person's own; the planner is instructed never to
        write copy they did not ask for.
      type: object
      properties:
        type:
          type: string
          enum: [motionTitle]
        text:
          type: string
          minLength: 1
          maxLength: 120
        at:
          type: number
          minimum: 0
        durationSeconds:
          type: number
          minimum: 0.4
          maximum: 20
          default: 2.5
        style:
          description: >
            card is a full statement held in the middle of frame; lower-third is
            a name or label that does not interrupt; word is one emphasised word,
            bigger and shorter than either.
          type: string
          enum: [card, lower-third, word]
          default: card
        position:
          type: string
          enum: [top, center, bottom]
          default: center
      required: [type, text, at]

    ExtractHighlightOperation:
      description: >
        Keep only the strongest stretch of the clip. The caller names a length;
        the worker chooses where those seconds live, from the transcript when
        one exists and from the middle of the clip when nothing can be heard —
        saying which in the notes.
      type: object
      properties:
        type:
          type: string
          enum: [extractHighlight]
        targetSeconds:
          description: How long the finished highlight should be, in seconds.
          type: number
          minimum: 5
          maximum: 120
          default: 30
      required: [type]

    ExtractRangeOperation:
      description: >
        Keep exactly the stretch the caller named, both ends in seconds on the
        source clock. The mirror image of extractHighlight - the caller names
        the moments and no judgement is invited. An end past the file's real
        length is clamped at render time with a note; an empty or inverted
        window is dropped, also with a note.
      type: object
      properties:
        type:
          type: string
          enum: [extractRange]
        startSeconds:
          description: Where the kept stretch begins, in seconds.
          type: number
          minimum: 0
          maximum: 86400
        endSeconds:
          description: Where it ends. Clamped to the file's real length.
          type: number
          minimum: 0
          maximum: 86400
      required: [type, startSeconds, endSeconds]

    ExtractClipsOperation:
      description: >
        Cut the video into several separate clips. The caller names how many
        and how long each should be; the worker chooses where each one lives -
        the same judgement extractHighlight makes, made several times over with
        the windows kept apart - and renders one output per clip. The outputs
        are listed by GET /projects/{id}/clips; the project's own pointer keeps
        meaning "the latest whole-video render".
      type: object
      properties:
        type:
          type: string
          enum: [extractClips]
        count:
          description: How many pieces to cut.
          type: number
          minimum: 2
          maximum: 6
          default: 3
        targetSeconds:
          description: How long each piece should be, in seconds.
          type: number
          minimum: 5
          maximum: 120
          default: 30
      required: [type]

    ColdOpenOperation:
      description: >
        Open on the strongest moment, then play from the top without it - the
        hook every short-form editor builds by hand. The moment is moved, not
        copied: every source moment still appears exactly once in the output,
        which is what keeps captions and punch-ins movable by arithmetic.
      type: object
      properties:
        type:
          type: string
          enum: [coldOpen]
        seconds:
          description: How much of the strongest moment to open on.
          type: number
          minimum: 1
          maximum: 15
          default: 4
      required: [type]

    JoinWaitlistBody:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        source:
          description: >
            Which page they signed up from. Sent by the page rather than
            inferred from the Origin header, because the two answer different
            questions - the header says which host served the script, this says
            which promise the person was reading.
          type: string
          maxLength: 120
      required: [email]

    JoinWaitlistResponse:
      type: object
      properties:
        joined:
          type: boolean
          enum: [true]
        total:
          description: >
            How many people are on the list, not this person's index in it. An
            index is a promise about order, and nothing stops us admitting
            people out of order.
          type: integer
      required: [joined, total]

    WaitlistEntrySummary:
      type: object
      properties:
        email: { type: string }
        source: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
      required: [email, source, createdAt]

    ListWaitlistResponse:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/WaitlistEntrySummary" }
        total: { type: integer }
      required: [entries, total]

    AdminOverview:
      description: >
        The row of cards at the top of the console. Every number here already
        existed in the database; what is new is that it can be looked at.
      type: object
      properties:
        queue:
          type: object
          properties:
            processing: { type: integer }
            waiting:
              description: Queued behind a live machine. Waiting is normal.
              type: integer
            unattended:
              description: Queued with nothing listening. This is the number that means something is wrong.
              type: integer
            failedLastDay: { type: integer }
            doneLastDay: { type: integer }
          required: [processing, waiting, unattended, failedLastDay, doneLastDay]
        worker:
          $ref: "#/components/schemas/WorkerStatus"
        accounts:
          type: object
          properties:
            total: { type: integer }
            newLastWeek: { type: integer }
          required: [total, newLastWeek]
        revenue:
          type: object
          properties:
            byPlan:
              type: array
              items:
                type: object
                properties:
                  plan: { $ref: "#/components/schemas/SubscriptionPlan" }
                  count: { type: integer }
                required: [plan, count]
            monthlyRecurringUsd: { type: number }
          required: [byPlan, monthlyRecurringUsd]
        billing:
          description: >
            The last events Freemius sent. No amounts and no payment details:
            Freemius is the merchant of record, and what we do not store we
            cannot leak.
          type: array
          items:
            type: object
            properties:
              eventId: { type: string }
              type: { type: string }
              email: { type: string, nullable: true }
              plan:
                allOf: [{ $ref: "#/components/schemas/SubscriptionPlan" }]
                nullable: true
              receivedAt: { type: string, format: date-time }
              applied: { type: boolean }
              outcome: { type: string, nullable: true }
            required: [eventId, type, email, plan, receivedAt, applied, outcome]
        minutesRenderedThisMonth: { type: number }
        posting:
          description: >
            The other queue: posts waiting to go out. It shares nothing with
            the render queue except a worker, and it fails in a way the render
            queue does not - a render nobody claims makes somebody wait and
            then complain, while a post nobody claims is simply not published,
            at a time the person chose and is not watching. `overdue` is the
            counterpart of queue.unattended and anything above zero means the
            sweep is not running. Optional, for the same reason `trends` is.
          type: object
          properties:
            dueSoon: { type: integer }
            overdue: { type: integer }
            stranded: { type: integer }
            publishedLastDay: { type: integer }
            failedLastDay: { type: integer }
            missedLastDay: { type: integer }
            accountsNeedingReconnect: { type: integer }
          required: [dueSoon, overdue, stranded, publishedLastDay, failedLastDay, missedLastDay, accountsNeedingReconnect]
        trends:
          description: >
            Fourteen days of the numbers the cards show one of. Every card on
            this screen is a count taken right now, and a count taken right now
            does not say which way it is going - which is the question somebody
            opens the console with. Optional so a console talking to an older
            API draws the cards without the lines rather than failing to render
            at all.
          type: object
          properties:
            signups: { $ref: '#/components/schemas/AdminTrend' }
            renders: { $ref: '#/components/schemas/AdminTrend' }
            minutes: { $ref: '#/components/schemas/AdminTrend' }
            failures: { $ref: '#/components/schemas/AdminTrend' }
          required: [signups, renders, minutes, failures]
      required: [queue, worker, accounts, revenue, billing, minutesRenderedThisMonth]

    SocialPlatform:
      description: One of the five places an edit can go, and whether it is usable.
      type: object
      properties:
        platform:
          type: string
          enum: [instagram, facebook, tiktok, x, snapchat]
        label: { type: string }
        connected:
          description: Whether this deployment holds credentials for it.
          type: boolean
        captionLimit:
          description: Characters, caption plus hashtags. Every platform counts both.
          type: number
        maxDurationSeconds: { type: number }
        shape:
          type: string
          enum: [vertical, any]
        needsReview:
          description: >
            Whether the platform reviews an app before it will let one post on
            somebody's behalf. Reported so a card can say why a platform is
            dark rather than saying "coming soon".
          type: boolean
      required: [platform, label, connected, captionLimit, maxDurationSeconds, shape, needsReview]

    UploadedFace:
      type: object
      description: >
        A font somebody uploaded. The two measured numbers are here because the
        picker draws each option in its own face and has to size the sample the
        way a caption would - and because a person should be able to see that
        their file was measured rather than take it on faith.
      properties:
        id: { type: string }
        label:
          type: string
          description: What the person called it.
        declared:
          type: string
          nullable: true
          description: >
            What the file calls itself, which is usually not what the person
            called it - `MyBrand-Final-2.otf` announces itself as something
            else entirely.
        script:
          type: string
          enum: [latin, arabic]
        status:
          type: string
          enum: [pending, preparing, ready, refused]
        capRatio:
          type: number
          nullable: true
          description: >
            The fraction of the line height a capital occupies - the alef, for
            Arabic. Measured by rendering, null until that has happened.
        widthScale:
          type: number
          nullable: true
          description: How wide this face runs against the one the layout's advance table was measured from.
        previewPath:
          type: string
          nullable: true
          description: >
            The subset the picker draws the sample in. The path is returned,
            unlike an asset's - it is this person's own object, they signed the
            upload themselves, and the browser must fetch it to draw anything.
        refusal:
          type: string
          nullable: true
          description: >
            Why it cannot be used, already in the reader's language. The row
            keeps both, so changing language does not change what a refusal
            says it was.
        bytes: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, label, declared, script, status, capRatio, widthScale, previewPath, refusal, bytes, createdAt]

    RegisterFontRequest:
      type: object
      properties:
        path:
          type: string
          description: "`<userId>/fonts/<name>`. Checked against the signed-in user, never trusted."
        label: { type: string }
        script:
          type: string
          enum: [latin, arabic]
        bytes: { type: integer }
        rights:
          type: string
          enum: [own, licensed, free]
          description: >
            What the person says about their right to use this font. Recorded,
            not verified - nothing can verify it. A font file carries no
            machine-readable statement of what its owner permits, and a name
            table saying "OFL" is a string somebody typed. Required rather than
            defaulted, so that uploading a font is an act in which the question
            was actually put.
      required: [path, label, script, rights]

    SocialAccount:
      description: >
        A connected account, without its token. The token lives in one table
        and leaves this process never.
      type: object
      properties:
        id: { type: string }
        platform: { type: string }
        handle: { type: string }
        displayName: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        status:
          description: >
            ok | expired | revoked - what the platform said the last time this
            token was used. A revoked token is indistinguishable from a working
            one until something is posted with it, and the moment a scheduled
            post was due is the wrong moment to find out.
          type: string
        statusDetail: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
      required: [id, platform, handle, displayName, avatarUrl, status, statusDetail, createdAt]

    ScheduledPost:
      description: >
        One edit, going to one account, at one time. Four destinations is four
        of these, because they fail independently.
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        exportId: { type: string, nullable: true }
        accountId: { type: string }
        platform: { type: string }
        caption: { type: string }
        hashtags:
          type: array
          items: { type: string }
        scheduledFor: { type: string, format: date-time }
        status:
          description: scheduled | publishing | published | failed | cancelled
          type: string
        externalUrl: { type: string, nullable: true }
        error:
          description: >
            Why it did not go out, in words a person can act on. Same rule as
            a failed render: a platform's raw refusal is a slug and a request
            id.
          type: string
          nullable: true
        publishedAt: { type: string, format: date-time, nullable: true }
      required: [id, projectId, exportId, accountId, platform, caption, hashtags, scheduledFor, status, externalUrl, error, publishedAt]

    AdminTrend:
      description: A fortnight of one number, and the two weeks it splits into.
      type: object
      properties:
        daily:
          description: >
            Exactly fourteen entries, oldest first, including the days with
            nothing in them. A series that drops its empty days draws a busy
            week and a dead one as the same shape.
          type: array
          items: { type: number }
        thisWeek: { type: number }
        lastWeek: { type: number }
      required: [daily, thisWeek, lastWeek]

    AdminAccount:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        lastSignInAt: { type: string, format: date-time, nullable: true }
        plan: { $ref: "#/components/schemas/SubscriptionPlan" }
        projectCount: { type: integer }
        minutesUsedThisMonth: { type: number }
        minutesIncluded: { type: number }
      required:
        [userId, email, createdAt, lastSignInAt, plan, projectCount, minutesUsedThisMonth, minutesIncluded]

    ListAdminAccountsResponse:
      type: object
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AdminAccount" }
        total:
          description: Counted independently of the page — a total derived from a page lies on page two.
          type: integer
      required: [accounts, total]

    AdminJob:
      description: >
        One render, as operations sees it. `error` is the sentence the customer
        was given and `errorDetail` is what actually happened; both, because
        they answer different questions and for months only the first was here
        while this description claimed it was the second. The value of this
        screen is turning "my video did not work" into an answer, and a message
        rewritten for reassurance has had the answer taken out.
      type: object
      properties:
        id: { type: string }
        userId: { type: string, format: uuid }
        projectId: { type: string }
        status: { type: string }
        progress: { type: integer }
        stage: { type: string, nullable: true }
        error: { type: string, nullable: true }
        errorDetail:
          type: string
          nullable: true
          description: >-
            The failure unedited, for whoever has to fix it. Anything that is
            not a plan, length or transfer problem reaches the customer as
            "Rendering failed. We are looking into it.", and this is what that
            sentence was standing in for. Null on rows that failed before the
            column existed.
        attempts: { type: integer }
        billedSeconds: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }
        lockedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        unattended: { type: boolean }
        notes:
          type: array
          nullable: true
          items: { type: string }
          description: >-
            What the renderer said it did, in its own words — the only record of
            a render that finished without doing what was asked. The renderer's
            own sentences about its own decisions: counts, seconds and values
            out of the plan. Nothing from inside the video.
      required:
        [id, userId, projectId, status, progress, stage, error, errorDetail, attempts, billedSeconds, createdAt, lockedAt, finishedAt, unattended, notes]

    ListAdminJobsResponse:
      type: object
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/AdminJob" }
        total: { type: integer }
      required: [jobs, total]

    AdminActionRecord:
      description: >
        One act of the console. `reason` is required everywhere, because it is
        the only part of an audit row a future reader cannot reconstruct from
        the rest of the database.
      type: object
      properties:
        id: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid }
        action:
          type: string
          enum: [requeue_job, grant_minutes, set_plan, set_suspended]
        subjectUserId: { type: string, format: uuid, nullable: true }
        subjectJobId: { type: string, nullable: true }
        reason: { type: string }
        detail: { type: object, additionalProperties: true, nullable: true }
        createdAt: { type: string, format: date-time }
      required: [id, actorUserId, action, subjectUserId, subjectJobId, reason, detail, createdAt]

    ListAdminActionsResponse:
      type: object
      properties:
        actions:
          type: array
          items: { $ref: "#/components/schemas/AdminActionRecord" }
        total: { type: integer }
      required: [actions, total]

    AdminReasonBody:
      type: object
      properties:
        reason:
          description: Six characters at least. A bar people route around is worse than a low one.
          type: string
          minLength: 6
          maxLength: 500
      required: [reason]

    GrantMinutesBody:
      allOf:
        - $ref: "#/components/schemas/AdminReasonBody"
        - type: object
          properties:
            minutes: { type: number, minimum: 1, maximum: 600 }
          required: [minutes]

    SetPlanBody:
      allOf:
        - $ref: "#/components/schemas/AdminReasonBody"
        - type: object
          properties:
            plan: { $ref: "#/components/schemas/SubscriptionPlan" }
          required: [plan]

    SetSuspendedBody:
      allOf:
        - $ref: "#/components/schemas/AdminReasonBody"
        - type: object
          properties:
            suspended: { type: boolean }
          required: [suspended]

    FadeOperation:
      description: >
        Fade in from black and out to black - the transition at the ends. The
        ends only, deliberately: a fade there leaves the video exactly as long
        as it was, so it composes with every other operation for free. One
        duration for both ends, because an opening and a closing that disagree
        read as an accident. Softening the joins inside the cut is a different
        operation with a different cost - see DissolveOperation.
      type: object
      properties:
        type:
          type: string
          enum: [fade]
        durationMs:
          description: How long each fade runs, in milliseconds.
          type: number
          minimum: 100
          maximum: 2000
          default: 500
      required: [type]

    TransitionOperation:
      description: >
        The transition between the cuts - one shot becoming the next. Where
        fade touches only the two ends and therefore no clock, this overlaps
        every join, so the edit comes out (joins x durationMs) shorter than the
        sum of its parts. That shortening is handed to the same mapping that
        places captions, punches, overlays and titles, so a caption written at
        0:41 of the recording still lands on the syllable it was written for.
        The renderer shortens the overlap when the shortest piece it joins
        cannot hold it, and says so in the notes.


        Shipped first as `dissolve` and renamed the same day, before anything
        had been stored under the old name - a type that appears in saved plans
        has to keep working, because a job row is a billing record and
        replaying it must produce what was paid for. Nothing was owed, so the
        honest name won: dissolve is one style among ten rather than the name
        of the whole idea.
      type: object
      properties:
        type:
          type: string
          enum: [transition]
        style:
          description: >
            A style and a direction as two fields would let
            {style: dissolve, direction: up} be written down, and a field
            silently ignored for half the values it accepts is a field that
            will be set wrongly and never noticed. Every value here is a thing
            that happens.
          type: string
          enum:
            [dissolve, wipeLeft, wipeRight, wipeUp, wipeDown, slideLeft, slideRight, slideUp, slideDown, flash]
          default: dissolve
        durationMs:
          description: How long each join overlaps, in milliseconds.
          type: number
          minimum: 80
          maximum: 1000
          default: 250
      required: [type]

    Clip:
      description: >
        One piece a clips render cut from the source. The storage path is
        returned - the worker wrote this file, so the browser has no other way
        to learn where it is - and only to the verified owner, exactly as
        editedVideoPath already is on the project. The browser signs its own
        playback URL from it.
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        jobId:
          description: Which render produced it - clips from one ask share a jobId.
          type: string
        idx:
          description: 1-based position in its set, in source order.
          type: number
        startSeconds:
          description: Where in the source this clip begins, in seconds.
          type: number
        endSeconds:
          type: number
        outputPath:
          type: string
        outputSeconds:
          type: number
          nullable: true
        note:
          description: The worker's one line about this clip.
          type: string
          nullable: true
        title:
          description: >
            The opening words spoken in this clip's window, from the
            transcript. Null when nothing was heard - a title the product
            invented would be a title the speaker never said.
          type: string
          nullable: true
        thumbnailPath:
          description: >
            Storage key of a frame grabbed from the middle of this clip, so a
            panel can show the piece without loading it. Null when the still
            could not be made - a missing poster never costs a render.
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        [id, projectId, jobId, idx, startSeconds, endSeconds, outputPath, outputSeconds, note, title, thumbnailPath, createdAt]

    RemoveSilenceOperation:
      type: object
      properties:
        type:
          type: string
          enum: [removeSilence]
        thresholdDb:
          type: number
          minimum: -60
          maximum: -10
          default: -32
        minSilenceMs:
          description: Shorter gaps than this are breath and rhythm, not silence.
          type: integer
          minimum: 100
          maximum: 5000
          default: 500
        paddingMs:
          description: Kept either side of a cut, so speech does not start clipped.
          type: integer
          minimum: 0
          maximum: 1000
          default: 120
        keepRanges:
          description: >
            Source-time spans that survive regardless — a pause held on purpose.
          type: array
          maxItems: 60
          items:
            type: object
            properties:
              startMs:
                type: number
                minimum: 0
              endMs:
                type: number
                minimum: 0
            required: [startMs, endMs]
      required: [type]

    TightenOperation:
      description: >
        Remove what was said and did not need to be: the hesitations, and the
        false starts where a sentence begins twice. Not removeSilence - those
        sounds are loud, so cutting the silences never touches one. Needs a
        transcript; a deployment with no recogniser loses it and says so.
      type: object
      properties:
        type:
          type: string
          enum: [tighten]
        fillers:
          description: >
            Hesitations - "um", "uh", a held «آآ». Never an ordinary word: the
            Arabic list refuses «يعني» and «طيب» because both are also words
            somebody meant, and cutting one changes what they said.
          type: boolean
          default: true
        repeats:
          description: >
            A phrase started, abandoned, and started again. The abandoned
            attempt is the one removed. Separate from fillers because the two
            fail differently - a filler wrongly cut removes a sound, a repeat
            wrongly cut removes a sentence.
          type: boolean
          default: true
      required: [type]

    FormatForPlatformOperation:
      type: object
      properties:
        type:
          type: string
          enum: [formatForPlatform]
        platform:
          type: string
          enum: [tiktok, reels, shorts, youtube, square]
        maxHeight:
          description: >
            Height of the exported frame; the width follows from 9:16. Asking is
            not getting — the plan clamps it to what the tier allows and the
            renderer clamps it again to what the source can actually fill, and
            both say so rather than quietly obeying.
          type: integer
          minimum: 720
          maximum: 2160
      required: [type, platform]

    CaptionWord:
      type: object
      properties:
        startMs:
          type: number
          minimum: 0
        endMs:
          type: number
          minimum: 0
        text:
          type: string
          minLength: 1
          maxLength: 60
      required: [startMs, endMs, text]

    BurnCaptionsOperation:
      type: object
      properties:
        type:
          type: string
          enum: [burnCaptions]
        cues:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              startMs:
                type: number
                minimum: 0
              endMs:
                type: number
                minimum: 0
              text:
                type: string
                minLength: 1
                maxLength: 300
              words:
                description: >
                  Per-word timing. Optional because not every source of cues
                  knows it — and karaoke is only honest with it, so the renderer
                  falls back to a plain fade rather than faking a rhythm.
                type: array
                items:
                  $ref: "#/components/schemas/CaptionWord"
            required: [startMs, endMs, text]
        style:
          type: string
          enum: [bold-white, bold-yellow, karaoke-box]
          default: bold-white
        animation:
          type: string
          enum: [none, pop, karaoke, kinetic]
          default: pop
      required: [type, cues]

    # Captions whose words are not known yet. The API has none — the words live
    # in the video, and only the worker has both the file and the recogniser —
    # so a plan says *that* it wants captions and how they should look, and the
    # worker replaces this with a real burnCaptions once it has a transcript, or
    # drops it and says why.
    AutoCaptionsOperation:
      type: object
      properties:
        type:
          type: string
          enum: [autoCaptions]
        style:
          type: string
          enum: [bold-white, bold-yellow, karaoke-box]
          default: bold-white
        animation:
          type: string
          enum: [none, pop, karaoke, kinetic]
          default: pop
        dropFillers:
          description: Leave "um" and "uh" out of what is burnt in.
          type: boolean
          default: true
        language:
          description: BCP-47 hint. Omit to let the recogniser detect the language.
          type: string
          minLength: 2
          maxLength: 16
      required: [type]

    WatermarkOperation:
      type: object
      properties:
        type:
          type: string
          enum: [watermark]
        text:
          type: string
          minLength: 1
          maxLength: 60
          default: Edited with Editly
        position:
          type: string
          enum: [bottom-right, bottom-center, top-right]
          default: bottom-right
      required: [type]

    KenBurnsOperation:
      type: object
      properties:
        type:
          type: string
          enum: [kenBurns]
        to:
          description: Zoom reached by the end. 1.08 is a push you feel but do not notice.
          type: number
          minimum: 1.01
          maximum: 1.5
          default: 1.08
      required: [type]

    ZoomPunchOperation:
      type: object
      properties:
        type:
          type: string
          enum: [zoomPunch]
        at:
          description: >
            Seconds into the *source* — the file as uploaded, before silence is
            cut — because emphasis is measured against the recording. The
            renderer converts them once and drops any whose moment did not
            survive the cut. Empty means "choose for me".
          type: array
          maxItems: 40
          items:
            type: number
            minimum: 0
        amount:
          type: number
          minimum: 0.02
          maximum: 0.6
          default: 0.12
        holdMs:
          type: integer
          minimum: 200
          maximum: 6000
          default: 1200
      required: [type, at]

    NormalizeLoudnessOperation:
      type: object
      properties:
        type:
          type: string
          enum: [normalizeLoudness]
        targetLufs:
          type: number
          minimum: -30
          maximum: -8
          default: -14
        # The clip is somebody talking, so take out what sits below their
        # voice. A phone records the room too - a fridge, a fan, traffic, the
        # desk the microphone is on - and almost all of it lives below 80Hz
        # where no speech does. Measured: the rumble drops 7.6dB and the voice
        # band comes out slightly louder, because levelling stops spending
        # headroom on sound nobody hears as anything. Off by default because
        # the same filter would take the bottom octave off a kick drum.
        voice:
          type: boolean
          default: false
      required: [type]

    # A ratio rather than an absolute, because "0.31 saturation" means nothing
    # without knowing what the footage measured to begin with. Clamped hard:
    # over-saturation is the first thing anyone notices when an automatic edit
    # has been over-eager.
    GradeOperation:
      type: object
      properties:
        type:
          type: string
          enum: [grade]
        saturation:
          description: 1 leaves the picture alone. Below 1 drains colour, above 1 pushes it.
          type: number
          minimum: 0.5
          maximum: 1.5
          default: 1
        look:
          description: >
            A named look, for people who cannot hand us a reference clip.
            Matching a reference is the better answer and came first, because
            it is measured against footage the person actually chose — but most
            people asking for "make it cinematic" have no reference to give,
            and the honest reply to them used to be a refusal. Applied before
            the saturation multiplier, so a look and a reference match compose:
            the look decides the mood, the reference decides how much colour.
            Deliberately few and deliberately gentle — the fastest way to make
            footage look cheap is to over-grade it.
          type: string
          enum: [none, warm, cool, cinematic, mono, punch]
          default: none
      required: [type]

    EditPlan:
      type: object
      properties:
        version:
          type: integer
          enum: [1]
        operations:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/EditOperation"
      required: [version, operations]

    RenderJob:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        status:
          type: string
          enum: [queued, running, done, failed]
        progress:
          type: number
        stage:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        plan:
          $ref: "#/components/schemas/EditPlan"
        outputPath:
          type: ["string", "null"]
        notes:
          description: See ExportJob.notes — what was done, and what could not be.
          type: array
          items:
            type: string
        waitSeconds:
          description: >
            Seconds until this render starts. Present only on a queued job, and
            null wherever the number would be invented - too few finished
            renders to have a typical one, no worker to divide by, or nothing
            ahead in the queue. A made-up wait is worse than none, because
            somebody plans around it.
          type: ["number", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - projectId
        - status
        - progress
        - stage
        - error
        - plan
        - outputPath
        - createdAt
        - updatedAt

    Template:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        bestFor:
          type: string
        needs:
          type: string
          nullable: true
          enum: [music, null]
          description: >-
            A file this look cannot be built without. Null for every look that
            needs nothing. The one value that exists today is `music`: the
            template lays the project's own track under the edit and cuts to it,
            so a project with no audio is refused before anything is queued.
      required: [id, name, description, bestFor, needs]

    # ── Paying, and leaving ───────────────────────────────────────────────────

    CheckoutConfig:
      type: object
      properties:
        productId:
          type: string
        publicKey:
          description: >
            Public by design. The secret key never leaves the server, because it
            is the only thing preventing anyone from forging a payment.
          type: string
        plans:
          description: >
            Plan name to Freemius id. Sent from here rather than hardcoded in
            the bundle, so renaming a plan does not require a frontend deploy.
          type: object
          additionalProperties:
            type: string
        currentPlan:
          $ref: "#/components/schemas/SubscriptionPlan"
      required: [productId, publicKey, plans, currentPlan]

    AccountDeletion:
      type: object
      properties:
        deleted:
          type: boolean
          enum: [true]
        projects:
          description: How many projects were removed, storage included.
          type: number
        loginRemoved:
          description: >
            False when the data went but the sign-in survived. Said out loud
            rather than folded into a success, because the person needs to know
            they can still log in to nothing.
          type: boolean
        note:
          description: Present only when there is something to explain.
          type: string
      required: [deleted, projects, loginRemoved]

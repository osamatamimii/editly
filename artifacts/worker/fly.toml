# The render worker. Deployed separately from the Vercel app, because ffmpeg
# cannot run there: no binary, a 250 MB bundle ceiling, and a timeout that
# expires long before any real render finishes.
app = "editly-worker"
primary_region = "fra"  # same region as the Supabase project, so pulling and
                        # pushing video does not cross a continent

# Long enough to put down what this machine is holding, and no longer.
#
# Fly sends SIGTERM and then SIGKILL, five seconds later by default. A render
# takes minutes to hours, so no value here can mean "let it finish" — what the
# process does with the signal is hand the job back to the queue so another
# machine takes it immediately, and thirty seconds is a very generous ceiling
# on one UPDATE. See `releaseHeldJob` in src/index.ts for what it costs the
# customer when that query does not land: half an hour of a project that looks
# stuck, and an attempt spent on a render that never failed.
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  POLL_INTERVAL_MS = "5000"
  # Where the links in the product's mail point. Not a secret, so it lives here
  # rather than in the secret store, and named rather than left to a default,
  # because a letter whose only link is wrong is worse than one with no link.
  APP_ORIGIN = "https://app.editlyai.io"

# No [http_service]: this process serves nothing a customer reaches, and it must
# not be scaled to zero on inbound traffic, because there is none. It polls the
# queue and exits only when told to.
#
# It does answer one thing, on the private network only, and the check below is
# the reason. `[deploy]` further down says a deploy that cannot pass its health
# window is rolled back — and until this existed there was no window and nothing
# to pass, so Fly promoted whatever the image did as long as the process had not
# exited yet. A worker that started, could not reach the database, and sat in
# its retry loop was a successful deploy, and the queue stopped silently. That
# is the shape of the 12 August outage.
#
# The heartbeat row is the wrong signal for this and `watch.yml` is the right
# place for it: during a rolling deploy the old machine is still writing that
# row, so it says yes while the new one is failing to start. A deploy check has
# to be answered by the process being checked. See src/health.ts.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  # No `ports` block: nothing is published to the internet. This service exists
  # so Fly's own checks have somewhere to knock.
  auto_stop_machines = false
  auto_start_machines = false

  [[services.http_checks]]
    path = "/healthz"
    method = "get"
    # Ten seconds, which is long for a `select 1` and short enough that a
    # machine failing to start is caught inside a deploy rather than after it.
    interval = "10s"
    timeout = "2s"
    # The first render can begin before this elapses; what it buys is room for
    # the database handshake on a cold machine.
    grace_period = "15s"

# One render per machine, and that is a measurement rather than a preference.
#
# An edit that plays out of order gives each piece its own decode of the source,
# and peak resident memory for the whole ffmpeg process was measured on a 1080p
# clip at 602 MB for two pieces, 1088 MB for six and 1532 MB for eight — the
# table is in ffmpeg.ts beside MAX_SEPARATE_DECODES. One render already fills
# most of this box. A second one inside it does not go slower, it gets
# OOM-killed, and an OOM is not a failed render: the job dies with no note and
# no output while the customer's minute is spent either way.
#
# So capacity here is machines, not threads. Raising `memory` would buy room for
# more pieces in one render, not for two renders — that is what the piece cap is
# for. Adding throughput is `WORKER_COUNT` in the deploy workflow, and the
# product divides its wait estimate by however many are actually beating.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1

# Half a gigabyte of swap, which is not extra memory and is not meant to be.
#
# The piece cap keeps a render inside this box, but the cap is arithmetic on
# measurements and the measurements were taken on particular files. A source
# whose resolution or bitrate sits outside them goes a little over — and
# without swap "a little over" is the OOM killer taking the process with no
# exit code, no stderr, no output and the customer's minute spent, which is the
# one failure mode this codebase cannot report on because nothing survives it
# to report. With swap the same render finishes slowly and says so in its
# duration.
#
# Deliberately small. Enough to absorb an overshoot; not enough to let a render
# that is genuinely too large thrash for an hour instead of failing.
swap_size_mb = 512

[deploy]
  # Rolling, so a deploy does not empty the queue of workers for a moment. Two
  # copies overlapping is safe on its own — the claim is FOR UPDATE SKIP LOCKED,
  # which is also what makes running several machines safe at all.
  strategy = "rolling"

[processes]
  worker = "node --enable-source-maps dist/index.mjs"

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Editly — Stop editing. Start describing.</title>
    <meta name="description" content="Upload a raw take, say what you want in plain language, and get back something ready to post. Priced by the minutes you publish, not the hours you record." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS composites this onto black, so unlike the favicon it carries its
         own ground rather than being transparent. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0A090B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF8FE" media="(prefers-color-scheme: light)" />

    <meta property="og:title" content="Editly — Stop editing. Start describing." />
    <meta property="og:description" content="Upload a raw take, say what you want, and get back something ready to post." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Three faces, and each one earns its request.

      Inter for everything that is read: interface, body, chat. It is the most
      legible screen face there is at small sizes and it is already here.

      Cabinet Grotesk for headings only. Inter at 700 is a fine heading and an
      anonymous one — the whole category now looks like the same page, because
      it is the same font at the same weight. A display face with actual
      character is the cheapest thing that makes a product look like it was
      made by someone.

      IBM Plex Sans Arabic because half of what this product renders is Arabic,
      and falling through to whatever the system happens to have is how Arabic
      ends up looking like an afterthought next to a carefully set English
      line. It sits in the sans stack after Inter: Latin glyphs never reach it,
      Arabic ones always do.

      All three `display=swap`, all three preconnected, and the stacks fall back
      to Inter and then to the system — a font CDN having a bad morning must
      cost the look and never the page.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800,900&display=swap" rel="stylesheet">
    <!--
      Runs before the first paint, on purpose.

      React cannot do this job. By the time the bundle has parsed and mounted,
      the browser has already painted a frame — so a returning visitor on the
      light theme gets a black flash, every single load. It is brief and it
      looks broken, and the only fix is to decide the theme synchronously in
      the document head.

      Blocking (no defer, no module) for the same reason: this must finish
      before anything is drawn. It is small enough that the cost is nothing.

      The key is duplicated from src/lib/theme.tsx rather than imported,
      because there is no module system here yet. If it ever changes, it has
      to change in both places — hence the comment on the other side too.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("editly:theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              (!window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches));
          document.documentElement.classList.add(dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          // Storage blocked, or something older than we support. Dark is the
          // default anyway, and :root already carries it.
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

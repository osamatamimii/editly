<!DOCTYPE html>
<!--
  The document opens in Arabic, because the landing page is written in it - and
  the script further down turns that off for the screens that are not.

  `lang="ar" dir="rtl"` was here alone, and the reasoning was right as far as
  it went: a crawler, a screen reader and a translation prompt all read the
  document, and they were being told English on a product whose default
  language is Arabic. What it missed is that this is one document for every
  route. The landing page sets its own wrapper and was always correct.
  Everything behind the login screen is written in English and set nothing, so
  it inherited `rtl` and rendered English right to left: a trailing full stop
  moved to the front of every sentence, and the dollar sign to the wrong end of
  every price. See src/lib/language.tsx for the measurements.

  So the attributes here are the first frame of the landing page, and the
  script below corrects them before paint for anything else. React maintains
  them from mount onwards.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      No `maximum-scale`. It was there, and it disabled pinch-zoom: a WCAG 1.4.4
      failure and a standard flag in an app-store or accessibility review. What
      it was bought for - a phone not zooming on an input focus - is already
      handled by the type scale, and it is not worth taking magnification away
      from somebody who needs it.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editly — Stop editing. Start describing.</title>
    <meta name="description" content="Upload a raw take, say what you want in plain language, and get back something ready to post. Priced by the minutes you publish, not the hours you record." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS composites this onto black, so unlike the favicon it carries its
         own ground rather than being transparent. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0A090B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF8FE" media="(prefers-color-scheme: light)" />

    <meta property="og:title" content="Editly — Stop editing. Start describing." />
    <meta property="og:description" content="Upload a raw take, say what you want, and get back something ready to post." />
    <!--
      Absolute, and that is the whole point of this line.

      It was `/og-image.png`. Facebook, LinkedIn, WhatsApp, Slack and X all
      require an absolute URL for a card image and silently show nothing for a
      relative one - so the 105 KB card in `public/` had never appeared
      anywhere a link was shared. The waiting-list page got this right; the
      product did not.
    -->
    <meta property="og:image" content="https://app.editlyai.io/og-image.png" />
    <meta property="og:url" content="https://app.editlyai.io/" />
    <meta property="og:site_name" content="Editly" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://app.editlyai.io/og-image.png" />
    <link rel="canonical" href="https://app.editlyai.io/" />
    <!--
      Three faces, and each one earns its request.

      Inter for everything that is read: interface, body, chat. It is the most
      legible screen face there is at small sizes and it is already here.

      Cabinet Grotesk for headings only. Inter at 700 is a fine heading and an
      anonymous one — the whole category now looks like the same page, because
      it is the same font at the same weight. A display face with actual
      character is the cheapest thing that makes a product look like it was
      made by someone.

      IBM Plex Sans Arabic because half of what this product renders is Arabic,
      and falling through to whatever the system happens to have is how Arabic
      ends up looking like an afterthought next to a carefully set English
      line. It sits in the sans stack after Inter: Latin glyphs never reach it,
      Arabic ones always do.

      All three `display=swap`, all three preconnected, and the stacks fall back
      to Inter and then to the system — a font CDN having a bad morning must
      cost the look and never the page.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <!--
      Three families, and the third one earns its request.

      Instrument Serif Italic is the second half of the pairing a heavy sans
      makes with a slanted serif — the thing that makes an editorial headline
      read as set rather than typed. It was removed once, correctly, because it
      was being *loaded and never used*: a round trip and a font face for
      nothing.

      It is back because it is used, and used in exactly one place: the second
      line of the landing headline. That scoping is the whole design. Arabic has
      no italic, so a page whose typographic idea rests on one has no second
      half in the other language this product ships in — `.headline-serif` in
      index.css carries an RTL rule that drops back to the sans and re-states
      the contrast as weight and colour, which every font here already has and
      which survives translation.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800,900&display=swap" rel="stylesheet">
    <!--
      Runs before the first paint, on purpose.

      React cannot do this job. By the time the bundle has parsed and mounted,
      the browser has already painted a frame — so a returning visitor on the
      light theme gets a black flash, every single load. It is brief and it
      looks broken, and the only fix is to decide the theme synchronously in
      the document head.

      Blocking (no defer, no module) for the same reason: this must finish
      before anything is drawn. It is small enough that the cost is nothing.

      The key is duplicated from src/lib/theme.tsx rather than imported,
      because there is no module system here yet. If it ever changes, it has
      to change in both places — hence the comment on the other side too.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("editly:theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              (!window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches));
          document.documentElement.classList.add(dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          // Storage blocked, or something older than we support. Dark is the
          // default anyway, and :root already carries it.
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <!--
      The same argument as the theme above, for the same reason.

      By the time React has parsed and mounted, the browser has painted; a
      signed-in screen would show one frame of English laid out right to left
      before the provider corrected it. So the decision is made here, and the
      two halves are kept honest by `tools/language-test.mjs`, which reads the
      route list out of src/lib/language.tsx and fails if this copy of it has
      drifted.
    -->
    <script>
      (function () {
        try {
          var path = location.pathname.replace(/\/+$/, "") || "/";
          // Duplicated from BILINGUAL in src/lib/language-routes.ts. There is
          // no module system here yet, and tools/language-test.mjs compares the
          // two lists in both directions.
          var routes = ["/", "/login", "/reset-password", "/unsubscribe", "/onboarding", "/dashboard", "/project", "/export", "/clips", "/scheduled", "/account", "/admin"];
          var bilingual = path === "/" || routes.some(function (route) {
            return route !== "/" && (path === route || path.indexOf(route + "/") === 0);
          });
          var lang = "en";
          if (bilingual) {
            var kept = localStorage.getItem("editly:language") || localStorage.getItem("editly:landing-language");
            var asked = new URLSearchParams(location.search).get("lang");
            var chosen = asked === "ar" || asked === "en" ? asked : kept;
            lang = chosen === "en" ? "en" : "ar";
          }
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        } catch (e) {
          // Storage blocked, or a URL we cannot parse. The attributes on the
          // element already carry the landing page's default.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      What a person sees when the script does not run.

      An empty `<div id="root">` was the answer to JavaScript being off, a chunk
      failing to load, or an extension breaking the bundle - a blank white page
      with nothing on it and no way to tell it from an outage. This is also the
      only thing a crawler that does not execute scripts has ever been able to
      read about this product.
    -->
    <noscript>
      <div style="max-width:34rem;margin:12vh auto;padding:0 1.5rem;font-family:system-ui,sans-serif;line-height:1.6;text-align:center">
        <h1 style="font-size:1.5rem;margin:0 0 .75rem">Editly</h1>
        <p style="margin:0 0 .5rem">Upload a raw take, say what you want in plain language, and get back something ready to post.</p>
        <p style="margin:0 0 1.5rem" dir="rtl" lang="ar">ارفع لقطة خامًا، وقل ما تريد بكلماتك، واستلم شيئًا جاهزًا للنشر.</p>
        <p style="margin:0"><strong>This page needs JavaScript.</strong> · <strong dir="rtl" lang="ar">هذه الصفحة تحتاج جافاسكربت.</strong></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Runs every check in tools/ on every push.
#
# Every suite in tools/ — a few thousand assertions across twenty-one files, and
# until this existed, nothing that ran them. That is the same problem as the
# OpenAPI file that drifted for months and the migrations nobody applied, one
# level up: a check that only runs when somebody remembers is a check that stops
# running the week they are busy.
#
# The count is deliberately not written down here. A number in a comment is a
# claim nobody updates, which is the thing this file exists to stop.
#
# In a single day of looking, that gap had already produced a spec describing a
# different product, a suite that passed exactly once per database, a foreign
# key that reset the billing meter, and a health endpoint that could not fail.
# Every one of those was found by choosing to look. This is the thing that looks
# without being asked.
#
# It is deliberately one job rather than a matrix. The suites share an ffmpeg, a
# Chromium and a Postgres, and paying for those four times to save a few minutes
# of wall clock would trade a simple file for a fast one.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        # The version Supabase runs. A suite that passes against a different
        # major is a suite describing a different database — which is exactly
        # how ON DELETE CASCADE on jobs.project_id survived for weeks.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: editly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/editly_test
      # PLAYWRIGHT_BROWSERS_PATH is deliberately unset: browser-test prefers a
      # pinned Chromium where an environment provides one and otherwise lets
      # Playwright resolve its own, which is what a runner has after the install
      # step below.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - name: Install the tools the suites actually use
        run: |
          set -euo pipefail
          sudo apt-get update
          # ffmpeg for every render check; DejaVu because drawtext names it and
          # Arabic captions are set in it — a missing font renders *nothing*,
          # silently; the colour emoji font because a sticker without it is an
          # empty box and the suite would be measuring the runner's fonts
          # rather than the image's; python3-opencv for the subject tracker,
          # whose section skips itself when OpenCV is missing — and a section
          # that skips is a section that is not testing anything.
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-dejavu-core fonts-noto-color-emoji fontconfig python3 python3-opencv postgresql-client
          ffmpeg -version | head -1
          python3 -c "import cv2; print('opencv', cv2.__version__)"

      # The caption face, from the repository — the same bytes the worker image
      # copies in, not a package with the same name.
      #
      # The suite measures captions in drawn pixels and the layout converts cap
      # height through a ratio taken from a specific cut of this font. A runner
      # holding a different revision would measure something production does
      # not ship, which is a green suite about the wrong thing.
      - name: Install the caption faces the image ships
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/share/fonts/truetype/editly
          sudo cp artifacts/worker/fonts/*.ttf /usr/share/fonts/truetype/editly/
          sudo fc-cache -f > /dev/null
          # Every family in the catalogue, not a spot check on two of them: the
          # suites measure captions in drawn pixels and a family that does not
          # resolve here is measured as DejaVu, silently and green.
          node tools/font-test.mjs --resolve-only
          echo "caption faces ready"

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for the browser suite
        run: pnpm exec playwright install chromium

      - run: pnpm run typecheck

      # And the thing Vercel actually builds, built here.
      #
      # `typecheck` proves the types agree; it does not prove the bundle can be
      # assembled. A vite plugin, an import that resolves for tsc and not for
      # esbuild, an asset path that only exists in dev — each of those passes
      # every check above and fails at deploy. And a failed Vercel deploy is
      # quiet in the worst way: production keeps serving the previous commit,
      # so `main` is green, the dashboard says shipped, and the change is not
      # live. Twelve seconds to find that out here instead.
      - run: pnpm run vercel:build

      # Three migrations touch `storage.buckets`, `auth.uid()` and the roles a
      # managed Supabase project provides. A plain Postgres has none of them, so
      # the names are created first — from the same file the schema suite uses,
      # because a copy in each is how the two drift apart. It creates the names,
      # not the behaviour; the storage policies are checked against the real
      # thing by tools/storage-isolation.browser.js.
      - name: Stand in for the parts of Supabase the migrations name
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/testing/supabase-shim.sql

      # The database is built the way production is built. Anything else and
      # these suites describe a product that is not the one being shipped —
      # which is exactly how a cascade that reset the billing meter survived.
      - name: Build the database from the migrations
        run: pnpm run migrate

      # ── The suites ──────────────────────────────────────────────────────────
      #
      # Listed one per line rather than globbed, so adding a suite is a
      # deliberate act and `deploy-test` can assert that none has been forgotten.
      # Ordered cheapest first: a typo fails in seconds rather than after the
      # renders.
      # The capability table, and the four holes it looks for: an operation in
      # the contract with no renderer branch, one built that nothing can ask
      # for, one the two planners disagree about, and one no suite names. Also
      # a route file nobody wrote a purpose line for. Cheap, and first, because
      # what it catches is a thing somebody added and did not finish wiring.
      - run: node tools/inventory.mjs --check
      - run: node tools/contract-test.mjs
      - run: node tools/deploy-test.mjs
      - run: node tools/pricing-test.mjs
      - run: node tools/theme-test.mjs
      - run: node tools/upload-types-test.mjs
      # The storage seam. Its second driver is not switched on anywhere, which
      # is exactly why it is checked: a driver first exercised during a
      # migration, on live customer files, is not a plan. The R2 signature is
      # verified against AWS's own published vector, so being right does not
      # depend on having an account.
      - run: node tools/object-store-test.mjs
      # The other half of that seam: the endpoint that mints the signed upload
      # URL, and the decisions it makes before it mints one. Reads no bucket
      # and no database, because the decision is a pure function and the wiring
      # around it is checked by reading the route.
      - run: node tools/uploads-test.mjs
      - run: node tools/policy-test.mjs
      # The privacy page cannot become a lie by addition: every host the code
      # sends a request to has to be named on it.
      - run: node tools/privacy-test.mjs
      - run: node tools/refusal-test.mjs
      - run: node tools/posting-test.mjs
      # Beside posting, because it is the step posting never had: a way to put
      # a real account into the queue.
      - run: node tools/connect-test.mjs
      # And the other end of it: what actually reaches YouTube, and what a
      # failed post says to the person who scheduled it.
      - run: node tools/publish-test.mjs
      # The two platforms after YouTube, driven against APIs that answer the way
      # theirs do: TikTok refuses with HTTP 200 and a code in the envelope, and
      # Graph refuses with HTTP 200 and an error object. A client that read the
      # status code would mark published a post that never existed.
      - run: node tools/publish-tiktok-test.mjs
      - run: node tools/publish-meta-test.mjs
      - run: node tools/publish-x-test.mjs
      # Snapchat has no upload, and the refusal is what is checked: Snap's only
      # public profile API is allowlist-only, needs a business organisation, and
      # reads rather than posts. A decision with no test decays unnoticed.
      - run: node tools/publish-snapchat-test.mjs
      - run: node tools/deadline-test.mjs
      - run: node tools/planner-test.mjs
      # Beside the planner, because the sentence is half of it: cutting a word
      # somebody meant is worse than leaving one they did not, so the checks
      # that an ordinary word is never removed are the ones that matter.
      - run: node tools/tighten-test.mjs
      # Kinetic captions, in drawn pixels rather than in the subtitle file: ASS
      # is a format with opinions, and two of them shaped this design — an
      # \alpha override splits the layout run the same way \kf does, and a
      # scale on one word widens the whole line.
      - run: node tools/kinetic-test.mjs
      # The first screen, held to the parser it teaches people to use: every
      # suggested sentence is run through the real keyword planner in both
      # languages. Copy that drifts from the parser means the first thing a new
      # person ever asks for comes back refused, and nobody who hits that files
      # a bug.
      - run: node tools/onboarding-test.mjs
      # Beside the planner, because what it checks is a rule about the parser:
      # a habit must never be applied over the sentence somebody just typed.
      - run: node tools/habits-test.mjs
      - run: node tools/vocabulary-test.mjs
      - run: node tools/font-test.mjs
      # After font-test, because it needs the same faces installed and there is
      # no point measuring an uploaded font on a runner whose reference faces
      # are wrong.
      - run: node tools/user-font-test.mjs
      # Needs the database as well as the faces, so it sits after both.
      - run: node tools/typeface-test.mjs
      - run: node tools/account-test.mjs
      - run: node tools/critic-test.mjs
      # Beside the critic, because it is the other half of the same job: the
      # critic reads the plan, this reads the file that came out of it — the
      # level that actually landed, a black picture, and the look at the
      # frames. Its one dangerous path is a vision model's prose reaching a
      # customer, and that is what most of the suite is about.
      - run: node tools/review-test.mjs
      - run: node tools/transcript-test.mjs
      # After the transcript, because it is the step that reads one: chapters,
      # claims, questions, peaks and a hook. Its checks are asymmetric on
      # purpose — a reading that invents a sentence somebody never said parses,
      # validates and looks exactly like a true one, so most of the suite is
      # about what gets *dropped*.
      - run: node tools/comprehend-test.mjs
      - run: node tools/reference-test.mjs
      - run: node tools/billing-test.mjs
      # Beside billing, because the webhook is the one place that sends today.
      # Its real question is whether a message can go out twice: a redelivered
      # event is the ordinary case for that endpoint, and an email cannot be
      # taken back.
      - run: node tools/mail-test.mjs
      - run: node tools/models-test.mjs
      - run: node tools/meter-test.mjs
      - run: node tools/style-test.mjs
      - run: node tools/schema-test.mjs
      # Beside the schema suite because it needs the same database, and after it
      # because it is the question that one cannot ask: not "is the schema what
      # the files say", but "if this database were gone, is what comes back one
      # the product can read". It dumps, restores onto a scratch server, and
      # then damages two restores on purpose so that the verifier is known to
      # fail when it should. Skips itself with a sentence where there is no
      # Postgres; never touches anything it did not create.
      - run: node tools/restore-drill.mjs
      - run: node tools/queue-test.mjs
      # The wait a queued render reports. Runs its arithmetic everywhere and its
      # SQL where there is a database — a predicate that is subtly wrong passes
      # every pattern match and gives everybody in the queue a quiet lie.
      - run: node tools/capacity-test.mjs
      - run: node tools/isolation-test.mjs
      - run: node tools/publisher-test.mjs
      - run: node tools/quality-test.mjs
      - run: node tools/framing-test.mjs
      # Beside framing, because it is the other half of the same question: that
      # one places the window, this one changes how wide it is across the cuts.
      - run: node tools/shots-test.mjs
      - run: node tools/render-test.mjs
      - run: node tools/combination-test.mjs
      - run: node tools/promise-test.mjs
      - run: node tools/bilingual-test.mjs
      - run: node tools/overlay-test.mjs
      - run: node tools/motion-test.mjs
      - run: node tools/beat-test.mjs
      - run: node tools/checkout-test.mjs
      - run: node tools/stock-test.mjs
      # Beside browser-test, and for the failure browser-test cannot see: a React
      # exception used to unmount the tree and leave a blank document, with
      # nothing logged anywhere on our side. This one throws inside a real
      # component in a real browser and reads what is on the screen afterwards.
      - run: node tools/boundary-test.mjs
      - run: node tools/browser-test.mjs
      # Needs the built `dist/` from the vercel:build step above — it measures
      # the shipped bundle, because a class Tailwind purged is a class that is
      # not there however good it looks in the source.
      - run: node tools/viewport-test.mjs
      # Same built `dist/`, different question: not whether the page is right
      # but what it costs to open and to scroll. Weighs the entry chunk against
      # a budget and fails on a filter, a blur radius or a hidden <video> that
      # the compositor pays for and nobody sees.
      - run: node tools/speed-test.mjs
      # Also the built `dist/`, and the last of the three that reads it: the
      # landing page rendered in both languages and both directions, because a
      # layout that is right in one and broken in the other is invisible to
      # everyone on the team who only reads it in the direction they use.
      - run: node tools/landing-test.mjs
      - run: node tools/worker-test.mjs
      # Beside the worker because that is where it runs, and separate because
      # of what it is: the only thing in this product that deletes. Its checks
      # are asymmetric on purpose — that a cold preview goes is ordinary; that
      # the master never can, that nothing ages from before the day the column
      # started being written, and that the object is deleted before the row
      # that names it, are the ones the thresholds were chosen for.
      - run: node tools/retention-test.mjs
      - run: node tools/sfx-test.mjs
      # Last, because it is the whole product and the slowest thing here: a
      # phone-sized browser, a real take, one sentence, and a real render by the
      # real worker binary. Everything above tests a part; this is the only one
      # that answers "does the tool work". It rebuilds the front end against its
      # own storage stub, so it must come after the suites that measure the
      # deployed `dist/`.
      - run: node tools/end-to-end-test.mjs

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Editly API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project management
  - name: messages
    description: Chat messages
  - name: exports
    description: Export operations
  - name: stats
    description: Dashboard stats
  - name: subscription
    description: Subscription and plan management
  - name: render
    description: Starting and following an edit
  - name: billing
    description: Checkout configuration and the payment webhook
  - name: account
    description: Changing or ending an account

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: >
        Asks the database what columns it has and compares them to what this
        build reads. It used to answer ok from a constant, and did so throughout
        two days in which every query in the product was failing against a
        database five migrations behind.
      responses:
        "200":
          description: Reachable, and carrying every column this build expects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: >
            The database is unreachable, or behind the migrations. Not 200: a
            monitor reading healthy while the product serves empty screens is
            worse than no monitor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /projects/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List chat messages for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a user message and get AI response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "201":
          description: AI response message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePair"

  /projects/{id}/export:
    post:
      operationId: startExport
      tags: [exports]
      summary: Kick off an export job for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartExportBody"
      responses:
        "202":
          description: Export started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"

  /projects/{id}/export/status:
    get:
      operationId: getExportStatus
      tags: [exports]
      summary: Get export job status for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"

  /subscription:
    get:
      operationId: getSubscription
      tags: [subscription]
      summary: Get current subscription plan and usage
      responses:
        "200":
          description: Subscription details with usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionUsage"
    patch:
      operationId: updateSubscription
      tags: [subscription]
      summary: Update the current subscription plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionBody"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionUsage"

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /projects/{id}/render:
    post:
      operationId: startRender
      tags: [render]
      summary: Queue a real edit for this project
      description: >
        Accepts either a plan the caller composed or the id of a saved template.
        Whatever arrives, the server decides what actually runs: the plan's
        watermark, allowance, upload ceiling and export height are applied here
        and nothing the client sends can widen them.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    plan:
                      $ref: "#/components/schemas/EditPlan"
                  required: [plan]
                - type: object
                  properties:
                    templateId:
                      type: string
                  required: [templateId]
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"
        "402":
          description: The plan does not include something the request needs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This project already has a render in flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The source is longer than this plan accepts in one upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The month's allowance is used up, or this clip would exceed it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/render/status:
    get:
      operationId: getRenderStatus
      tags: [render]
      summary: The most recent render for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The render, or null if the project has never been rendered
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RenderJob"
                  - type: "null"

  /templates:
    get:
      operationId: listTemplates
      tags: [render]
      summary: The saved looks a render can be started from
      description: >
        A template is a saved edit plan, resolved on the server so the numbers
        behind a named look live in one place and the result is identical every
        time.
      responses:
        "200":
          description: Available templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /billing/checkout:
    get:
      operationId: getCheckoutConfig
      tags: [billing]
      summary: What the browser needs to open a checkout
      description: >
        Public identifiers only. The secret key never leaves the server, because
        it is the only thing preventing anyone from forging a payment.
      responses:
        "200":
          description: Checkout configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutConfig"

  /billing/webhook:
    post:
      operationId: billingWebhook
      tags: [billing]
      summary: Freemius calls this when a payment changes
      description: >
        Deliberately unauthenticated in the session sense: it is called from the
        open internet with no token. Its authentication is an HMAC-SHA256
        signature over the raw request body, verified with a constant-time
        compare. Events we do not recognise are answered 200 rather than
        guessed at.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Accepted, or recognised and ignored
        "401":
          description: The signature did not verify
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Remove everything belonging to this account
      description: >
        The videos, the projects, the conversation, the render history and the
        login. Either it happens or it is refused — never partial and reported
        as complete. Job rows survive on purpose: minutes that were produced
        were produced, and cascading them would make deleting projects a way to
        reset the meter.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletion"
        "503":
          description: >
            Refused. The credentials needed to reclaim stored video are not
            configured, and nothing was touched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: The files this project can put on screen
      description: >
        Everything besides the one video being cut — b-roll, a screenshot, a
        logo, music. The storage path is deliberately absent from the response:
        the browser already knows where it put a file, and echoing paths back
        turns any future enumeration bug into a data leak.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The project's library, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "404":
          description: >
            No such project, or not this account's. The same answer for both, so
            that whether an id exists is not learnable from a status code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: registerAsset
      tags: [assets]
      summary: Record a file the browser has already uploaded
      description: >
        The bytes go straight from the browser to Storage under the signed-in
        user's own session. This records where they landed — and refuses to
        believe the claim unless the path is inside this user's folder for this
        project.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAssetBody"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: The path is not inside this project's folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The project already holds as many files as it may
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/assets/{assetId}:
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Remove one file from the project's library
      description: >
        Scoped by user and project and asset together, so an id guessed from
        another account deletes nothing. The stored object is left alone: a
        per-asset delete that half-succeeds leaves a row pointing at nothing,
        and deleting the project reclaims the whole folder in one call.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          description: No such asset in this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/search:
    get:
      operationId: searchStock
      tags: [stock]
      summary: Search the stock library
      description: >
        Free clips and photography, searched through us so the key never reaches
        the browser. With no key configured this answers 503 rather than an
        empty list — "we have not switched this on" and "there are no photos of
        cats" are different answers.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [image, video]
            default: image
      responses:
        "200":
          description: What the library has
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StockItem"
                required: [items]
        "400":
          description: The search term is too short or too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The stock provider did not answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No stock key is configured for this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/preview/{id}:
    get:
      operationId: getStockPreview
      tags: [stock]
      summary: Stream the small rendition, for looking rather than keeping
      description: >
        The same resolution and allowlist as the download, applied to the
        smallest file the provider offers. Same origin on purpose: no dependency
        on a third party's CORS or uptime, and nothing for a blocker to remove.
        Cached for an hour — a clip someone scrolls back to should not be
        fetched twice. It does not make an undecodable clip decodable: a browser
        without H.264 plays neither the provider's copy nor ours, and the panel
        says so rather than spinning.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^(photo|video):[0-9]{1,15}$"
      responses:
        "200":
          description: The small rendition
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: That is not a stock id, or there is nothing small to send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The provider refused the file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No stock key is configured for this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/file/{id}:
    get:
      operationId: getStockFile
      tags: [stock]
      summary: Stream one stock file
      description: >
        The id is resolved by the provider and the resulting URL is checked
        against an allowlist before a byte is fetched — the client never names a
        file, because a client-supplied URL is a server-side request forgery.
        Streamed rather than buffered, and capped on the way through.
      parameters:
        - name: id
          in: path
          required: true
          description: A namespaced stock id, "photo:123" or "video:456".
          schema:
            type: string
            pattern: "^(photo|video):[0-9]{1,15}$"
      responses:
        "200":
          description: >
            The file. Its kind, label, dimensions and duration come back as
            X-Stock-* headers so the caller can register it without a second
            round trip and without inventing any of it.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: That is not a stock id, or the provider does not have it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Larger than we will pass through
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The provider refused the file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No stock key is configured for this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      description: The project's id. Ownership is checked on every route that takes it.
      schema:
        type: string

  schemas:
    # Three states, not a boolean, because they are three different jobs for
    # whoever is reading: nothing, run the migrations, check the connection.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, behind, unreachable]
        database:
          type: object
          properties:
            reachable:
              type: boolean
            missingColumns:
              description: >
                Qualified as table.column. Populated when the database is behind
                the migrations this build expects — naming them turns the fix
                from an afternoon of stack traces into a minute.
              type: array
              items:
                type: string
          required: [reachable, missingColumns]
        capabilities:
          description: >
            Which optional parts of the product this deployment actually has.
            Booleans only — never a key name and never a key value, because this
            endpoint is public. It exists because the recurring question has not
            been "is the server up" but "is the thing we built switched on", and
            that was otherwise only answerable by reading a dashboard or waiting
            for a customer to hit a 503.
          type: object
          properties:
            storageAdmin:
              description: >
                Reclaiming stored video is configured. Account deletion is
                refused while this is false, because removing the rows without
                the bytes is an orphaning dressed up as a deletion.
              type: boolean
            storageCheck:
              description: >
                Whether that key actually authenticates — asked of Storage with
                a list against a prefix that matches nothing, and cached, so a
                public endpoint cannot be turned into a load generator. A
                present-but-wrong key is indistinguishable from a right one
                until a customer asks to delete their account.
              type: string
              enum: [ok, unauthorized, unreachable, not-configured]
            planner:
              description: >
                A model choosing the operations. Without it the keyword matcher
                does, which is worse and honest about being worse.
              type: boolean
            stockLibrary:
              type: boolean
            billing:
              description: Without it the payment webhook refuses every request.
              type: boolean
          required: [storageAdmin, storageCheck, planner, stockLibrary, billing]
        message:
          type: string
      required:
        - status
        - database

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Project:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [uploading, ready, processing, done, failed]
        thumbnailUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        editedVideoUrl:
          type: ["string", "null"]
        videoPath:
          description: Storage object key for the uploaded source video.
          type: ["string", "null"]
        editedVideoPath:
          description: Storage object key for the rendered output, once one exists.
          type: ["string", "null"]
        thumbnailPath:
          description: Storage object key for the poster frame.
          type: ["string", "null"]
        referenceVideoPath:
          description: >
            Storage object key of a video whose look this project should match.
            Uploaded, never fetched from a link.
          type: ["string", "null"]
        duration:
          type: ["number", "null"]
        width:
          description: Source video width in pixels, measured at upload.
          type: ["integer", "null"]
        height:
          description: Source video height in pixels, measured at upload.
          type: ["integer", "null"]
        editedWidth:
          description: >
            Edited output width in pixels, measured by the worker from the file
            it produced. Null until a render has finished.
          type: ["integer", "null"]
        editedHeight:
          description: Edited output height in pixels, measured by the worker.
          type: ["integer", "null"]
        platform:
          type: ["string", "null"]
          enum: [tiktok, reels, shorts, null]
        renderStalled:
          description: The render is queued but no worker has claimed it.
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - title
        - status
        - thumbnailUrl
        - videoUrl
        - editedVideoUrl
        - videoPath
        - editedVideoPath
        - thumbnailPath
        - referenceVideoPath
        - duration
        - width
        - height
        - editedWidth
        - editedHeight
        - platform
        - renderStalled
        - createdAt
        - updatedAt

    CreateProjectBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    UpdateProjectBody:
      type: object
      properties:
        title:
          type: string
        status:
          type: string
          enum: [uploading, ready, processing, done, failed]
        thumbnailUrl:
          type: string
        videoUrl:
          type: string
        editedVideoUrl:
          type: string
        videoPath:
          type: string
        editedVideoPath:
          type: string
        thumbnailPath:
          type: string
        duration:
          type: number
        width:
          type: integer
        height:
          type: integer
        platform:
          type: string
          enum: [tiktok, reels, shorts]

    Message:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
      required:
        - id
        - projectId
        - role
        - content
        - createdAt

    SendMessageBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    MessagePair:
      type: object
      properties:
        userMessage:
          $ref: "#/components/schemas/Message"
        aiMessage:
          $ref: "#/components/schemas/Message"
      required:
        - userMessage
        - aiMessage

    ExportJob:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        status:
          type: string
          enum: [pending, processing, done, failed]
        platform:
          type: string
          enum: [tiktok, reels, shorts]
        downloadUrl:
          type: ["string", "null"]
        # The storage key this export produced, which the browser signs for
        # itself. It travels with the status it belongs to rather than being
        # read off the project, whose `editedVideoPath` is a cache of the
        # newest render — a copy fetched before this export existed once handed
        # people their original upload under a card saying the edit was ready.
        outputPath:
          type: ["string", "null"]
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ExportStep"
        # What the render did that the person should know about: captions
        # skipped for want of a key, punches dropped because the words they
        # landed on were cut, words the two speech models disagreed on. A
        # render that quietly did less than it was asked to, and looks
        # identical to one that did everything, is the failure this product is
        # built against.
        notes:
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - projectId
        - status
        - platform
        - downloadUrl
        - steps
        - createdAt
        - updatedAt

    ExportStep:
      type: object
      properties:
        label:
          type: string
        status:
          type: string
          enum: [pending, active, done]
      required:
        - label
        - status

    StartExportBody:
      type: object
      properties:
        platform:
          type: string
          enum: [tiktok, reels, shorts]
      required:
        - platform

    SubscriptionPlan:
      type: string
      enum: [free, creator, pro, studio]

    # The meter is minutes of finished video, not videos: counting videos
    # charged the same for a nine-second hook and a ninety-minute episode.
    # maxUploadMinutes is here because it is what actually separates the tiers.
    SubscriptionUsage:
      type: object
      properties:
        plan:
          $ref: "#/components/schemas/SubscriptionPlan"
        minutesIncluded:
          type: number
        minutesUsedThisMonth:
          type: number
        minutesRemaining:
          type: number
        maxUploadMinutes:
          type: number
        watermark:
          type: boolean
        referenceStyle:
          type: boolean
        pricePerMonth:
          type: number
      required:
        - plan
        - minutesIncluded
        - minutesUsedThisMonth
        - minutesRemaining
        - maxUploadMinutes
        - watermark
        - referenceStyle
        - pricePerMonth

    UpdateSubscriptionBody:
      type: object
      properties:
        plan:
          $ref: "#/components/schemas/SubscriptionPlan"
      required:
        - plan

    # Whether anything is listening, and what it can do. The queue can say a
    # render is stuck; it cannot say whether a worker exists — not for the first
    # five minutes, and not at all when nothing is queued. The worker's id is
    # deliberately absent: it carries a hostname and answers nobody's question.
    WorkerStatus:
      type: object
      properties:
        online:
          type: boolean
        lastSeenAt:
          type: ["string", "null"]
        transcription:
          description: The model's name, never a key. Null when none is configured.
          type: ["string", "null"]
        vision:
          type: ["string", "null"]
      required: [online, lastSeenAt, transcription, vision]

    DashboardStats:
      type: object
      properties:
        totalProjects:
          type: number
        processingCount:
          description: Renders a worker is actually working on.
          type: number
        stalledCount:
          description: Renders queued with no worker to run them.
          type: number
        doneCount:
          type: number
        recentProjects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        worker:
          $ref: "#/components/schemas/WorkerStatus"
      required:
        - totalProjects
        - processingCount
        - stalledCount
        - doneCount
        - recentProjects
        - worker

    # ── What a render is ──────────────────────────────────────────────────────

    # An operation is a decision, not a filter setting. Each carries only the
    # numbers a person would argue about; everything else the renderer derives,
    # so that the same plan against the same video always produces the same file.
    EditOperation:
      oneOf:
        - $ref: "#/components/schemas/RemoveSilenceOperation"
        - $ref: "#/components/schemas/ExtractHighlightOperation"
        - $ref: "#/components/schemas/FormatForPlatformOperation"
        - $ref: "#/components/schemas/BurnCaptionsOperation"
        - $ref: "#/components/schemas/AutoCaptionsOperation"
        - $ref: "#/components/schemas/WatermarkOperation"
        - $ref: "#/components/schemas/KenBurnsOperation"
        - $ref: "#/components/schemas/ZoomPunchOperation"
        - $ref: "#/components/schemas/NormalizeLoudnessOperation"
        - $ref: "#/components/schemas/GradeOperation"
        - $ref: "#/components/schemas/InsertBRollOperation"
        - $ref: "#/components/schemas/OverlayImageOperation"
        - $ref: "#/components/schemas/MotionTitleOperation"
      discriminator:
        propertyName: type

    Asset:
      description: >
        One file in a project's library. The storage path is deliberately not a
        property: the browser knows where it put the file and can sign its own
        URL, and a path in a response is a path in a future leak.
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        kind:
          type: string
          enum: [video, image, audio]
        label:
          type: string
          nullable: true
        bytes:
          type: integer
          minimum: 0
        durationSeconds:
          type: number
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        url:
          description: Always null. Present so the shape does not change later.
          type: string
          nullable: true
      required: [id, projectId, kind, bytes, createdAt]

    RegisterAssetBody:
      type: object
      properties:
        path:
          description: >
            Where the browser put the file. Checked against this user and this
            project before it is believed; every segment must be made of
            characters that cannot mean anything but themselves, so a traversal
            is unspellable rather than merely rejected.
          type: string
        kind:
          type: string
          enum: [video, image, audio]
        label:
          type: string
          nullable: true
        bytes:
          type: integer
          minimum: 0
        durationSeconds:
          type: number
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
      required: [path, kind, bytes]

    StockItem:
      description: >
        One result from the stock library. The id is namespaced — "photo:123" —
        because the provider's photo and video id spaces overlap, and because a
        client that can only name an id cannot name an internal address.
      type: object
      properties:
        id:
          type: string
          pattern: "^(photo|video):[0-9]{1,15}$"
        kind:
          type: string
          enum: [image, video]
        label:
          type: string
        previewUrl:
          description: A thumbnail, safe to put in a grid. Videos get a poster frame.
          type: string
          format: uri
        viewUrl:
          description: >
            A bigger still, for looking at one properly before committing to it.
          type: string
          format: uri
        playable:
          description: >
            Whether there is a clip to play. The bytes come from
            /stock/preview/{id} rather than from a URL in this object, so a
            preview depends on neither a third party's CORS nor its uptime.
            Whether it then decodes is the browser's business: one without H.264
            shows the poster frame and a line saying so.
          type: boolean
        width:
          type: integer
        height:
          type: integer
        durationSeconds:
          type: number
          nullable: true
        credit:
          description: The photographer. Carried into the asset's label, as the provider asks.
          type: string
        creditUrl:
          type: string
          format: uri
      required: [id, kind, label, previewUrl, viewUrl, width, height, credit, creditUrl]

    InsertBRollOperation:
      description: >
        Cut away to one of the project's own clips, keeping the speaker's audio
        underneath — a cutaway that silences them is not a cutaway, it is a cut.
      type: object
      properties:
        type:
          type: string
          enum: [insertBRoll]
        assetId:
          description: >
            Must name a video already in this project. The planner is offered
            only the ids that exist, and the answer is checked against the kind
            as well: an image here would not be a wrong edit, it would be a
            crash.
          type: string
        at:
          description: Seconds into the finished video, after any cuts.
          type: number
          minimum: 0
        durationSeconds:
          type: number
          minimum: 0.2
          maximum: 30
          default: 3
        fit:
          description: >
            cover fills the frame and crops the overflow, which is right for
            footage; contain letterboxes, which is right for a screenshot where
            cropping the edges destroys the point of showing it.
          type: string
          enum: [cover, contain]
          default: cover
        keepSourceAudio:
          type: boolean
          default: true
      required: [type, assetId, at]

    OverlayImageOperation:
      description: Hold one of the project's images over the frame.
      type: object
      properties:
        type:
          type: string
          enum: [overlayImage]
        assetId:
          type: string
        at:
          type: number
          minimum: 0
        durationSeconds:
          type: number
          minimum: 0.2
          maximum: 60
          default: 3
        position:
          type: string
          enum:
            [
              top-left,
              top-center,
              top-right,
              center,
              bottom-left,
              bottom-center,
              bottom-right,
            ]
          default: center
        scale:
          description: Fraction of the frame's width. 0.4 is a comfortable inset graphic.
          type: number
          minimum: 0.05
          maximum: 1
          default: 0.4
        opacity:
          type: number
          minimum: 0.05
          maximum: 1
          default: 1
      required: [type, assetId, at]

    MotionTitleOperation:
      description: >
        Words animated onto the screen, rendered in a real browser frame by
        frame so the easing is a spring rather than a bezier's approximation of
        one. The text is the person's own; the planner is instructed never to
        write copy they did not ask for.
      type: object
      properties:
        type:
          type: string
          enum: [motionTitle]
        text:
          type: string
          minLength: 1
          maxLength: 120
        at:
          type: number
          minimum: 0
        durationSeconds:
          type: number
          minimum: 0.4
          maximum: 20
          default: 2.5
        style:
          description: >
            card is a full statement held in the middle of frame; lower-third is
            a name or label that does not interrupt; word is one emphasised word,
            bigger and shorter than either.
          type: string
          enum: [card, lower-third, word]
          default: card
        position:
          type: string
          enum: [top, center, bottom]
          default: center
      required: [type, text, at]

    ExtractHighlightOperation:
      description: >
        Keep only the strongest stretch of the clip. The caller names a length;
        the worker chooses where those seconds live, from the transcript when
        one exists and from the middle of the clip when nothing can be heard —
        saying which in the notes.
      type: object
      properties:
        type:
          type: string
          enum: [extractHighlight]
        targetSeconds:
          description: How long the finished highlight should be, in seconds.
          type: number
          minimum: 5
          maximum: 120
          default: 30
      required: [type]

    RemoveSilenceOperation:
      type: object
      properties:
        type:
          type: string
          enum: [removeSilence]
        thresholdDb:
          type: number
          minimum: -60
          maximum: -10
          default: -32
        minSilenceMs:
          description: Shorter gaps than this are breath and rhythm, not silence.
          type: integer
          minimum: 100
          maximum: 5000
          default: 500
        paddingMs:
          description: Kept either side of a cut, so speech does not start clipped.
          type: integer
          minimum: 0
          maximum: 1000
          default: 120
        keepRanges:
          description: >
            Source-time spans that survive regardless — a pause held on purpose.
          type: array
          maxItems: 60
          items:
            type: object
            properties:
              startMs:
                type: number
                minimum: 0
              endMs:
                type: number
                minimum: 0
            required: [startMs, endMs]
      required: [type]

    FormatForPlatformOperation:
      type: object
      properties:
        type:
          type: string
          enum: [formatForPlatform]
        platform:
          type: string
          enum: [tiktok, reels, shorts]
        maxHeight:
          description: >
            Height of the exported frame; the width follows from 9:16. Asking is
            not getting — the plan clamps it to what the tier allows and the
            renderer clamps it again to what the source can actually fill, and
            both say so rather than quietly obeying.
          type: integer
          minimum: 720
          maximum: 2160
      required: [type, platform]

    CaptionWord:
      type: object
      properties:
        startMs:
          type: number
          minimum: 0
        endMs:
          type: number
          minimum: 0
        text:
          type: string
          minLength: 1
          maxLength: 60
      required: [startMs, endMs, text]

    BurnCaptionsOperation:
      type: object
      properties:
        type:
          type: string
          enum: [burnCaptions]
        cues:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              startMs:
                type: number
                minimum: 0
              endMs:
                type: number
                minimum: 0
              text:
                type: string
                minLength: 1
                maxLength: 300
              words:
                description: >
                  Per-word timing. Optional because not every source of cues
                  knows it — and karaoke is only honest with it, so the renderer
                  falls back to a plain fade rather than faking a rhythm.
                type: array
                items:
                  $ref: "#/components/schemas/CaptionWord"
            required: [startMs, endMs, text]
        style:
          type: string
          enum: [bold-white, bold-yellow, karaoke-box]
          default: bold-white
        animation:
          type: string
          enum: [none, pop, karaoke]
          default: pop
      required: [type, cues]

    # Captions whose words are not known yet. The API has none — the words live
    # in the video, and only the worker has both the file and the recogniser —
    # so a plan says *that* it wants captions and how they should look, and the
    # worker replaces this with a real burnCaptions once it has a transcript, or
    # drops it and says why.
    AutoCaptionsOperation:
      type: object
      properties:
        type:
          type: string
          enum: [autoCaptions]
        style:
          type: string
          enum: [bold-white, bold-yellow, karaoke-box]
          default: bold-white
        animation:
          type: string
          enum: [none, pop, karaoke]
          default: pop
        dropFillers:
          description: Leave "um" and "uh" out of what is burnt in.
          type: boolean
          default: true
        language:
          description: BCP-47 hint. Omit to let the recogniser detect the language.
          type: string
          minLength: 2
          maxLength: 16
      required: [type]

    WatermarkOperation:
      type: object
      properties:
        type:
          type: string
          enum: [watermark]
        text:
          type: string
          minLength: 1
          maxLength: 60
          default: Edited with Editly
        position:
          type: string
          enum: [bottom-right, bottom-center, top-right]
          default: bottom-right
      required: [type]

    KenBurnsOperation:
      type: object
      properties:
        type:
          type: string
          enum: [kenBurns]
        to:
          description: Zoom reached by the end. 1.08 is a push you feel but do not notice.
          type: number
          minimum: 1.01
          maximum: 1.5
          default: 1.08
      required: [type]

    ZoomPunchOperation:
      type: object
      properties:
        type:
          type: string
          enum: [zoomPunch]
        at:
          description: >
            Seconds into the *source* — the file as uploaded, before silence is
            cut — because emphasis is measured against the recording. The
            renderer converts them once and drops any whose moment did not
            survive the cut. Empty means "choose for me".
          type: array
          maxItems: 40
          items:
            type: number
            minimum: 0
        amount:
          type: number
          minimum: 0.02
          maximum: 0.6
          default: 0.12
        holdMs:
          type: integer
          minimum: 200
          maximum: 6000
          default: 1200
      required: [type, at]

    NormalizeLoudnessOperation:
      type: object
      properties:
        type:
          type: string
          enum: [normalizeLoudness]
        targetLufs:
          type: number
          minimum: -30
          maximum: -8
          default: -14
      required: [type]

    # A ratio rather than an absolute, because "0.31 saturation" means nothing
    # without knowing what the footage measured to begin with. Clamped hard:
    # over-saturation is the first thing anyone notices when an automatic edit
    # has been over-eager.
    GradeOperation:
      type: object
      properties:
        type:
          type: string
          enum: [grade]
        saturation:
          description: 1 leaves the picture alone. Below 1 drains colour, above 1 pushes it.
          type: number
          minimum: 0.5
          maximum: 1.5
          default: 1
      required: [type]

    EditPlan:
      type: object
      properties:
        version:
          type: integer
          enum: [1]
        operations:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/EditOperation"
      required: [version, operations]

    RenderJob:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        status:
          type: string
          enum: [queued, running, done, failed]
        progress:
          type: number
        stage:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        plan:
          $ref: "#/components/schemas/EditPlan"
        outputPath:
          type: ["string", "null"]
        notes:
          description: See ExportJob.notes — what was done, and what could not be.
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - projectId
        - status
        - progress
        - stage
        - error
        - plan
        - outputPath
        - createdAt
        - updatedAt

    Template:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        bestFor:
          type: string
      required: [id, name, description, bestFor]

    # ── Paying, and leaving ───────────────────────────────────────────────────

    CheckoutConfig:
      type: object
      properties:
        productId:
          type: string
        publicKey:
          description: >
            Public by design. The secret key never leaves the server, because it
            is the only thing preventing anyone from forging a payment.
          type: string
        plans:
          description: >
            Plan name to Freemius id. Sent from here rather than hardcoded in
            the bundle, so renaming a plan does not require a frontend deploy.
          type: object
          additionalProperties:
            type: string
        currentPlan:
          $ref: "#/components/schemas/SubscriptionPlan"
      required: [productId, publicKey, plans, currentPlan]

    AccountDeletion:
      type: object
      properties:
        deleted:
          type: boolean
          enum: [true]
        projects:
          description: How many projects were removed, storage included.
          type: number
        loginRemoved:
          description: >
            False when the data went but the sign-in survived. Said out loud
            rather than folded into a success, because the person needs to know
            they can still log in to nothing.
          type: boolean
        note:
          description: Present only when there is something to explain.
          type: string
      required: [deleted, projects, loginRemoved]

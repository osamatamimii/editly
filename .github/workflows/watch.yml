# The platform watching itself.
#
# On 12 August the render worker stopped and the outage ran for two days. The
# API was fine the whole time — it answered 200 to everything, because nothing
# was wrong with the API. Every render simply queued and none of them started,
# and the only thing that would have noticed was somebody choosing to look.
#
# This is the thing that looks. It is the same argument as checks.yml one level
# out: a check that only runs when somebody remembers is a check that stops
# running the week they are busy.
#
# ## Why a workflow rather than an alerting service
#
# Because it needs no new account, no new secret, and no new bill — and because
# GitHub already emails the owner when a scheduled workflow fails, which is the
# entire alerting requirement. The endpoint it reads is public and returns
# booleans, so this file holds nothing.
#
# ## What it deliberately does not do
#
# It does not read the database, and it does not start a render to prove the
# pipeline works. Both would be better evidence and both cost money on every
# run — a synthetic render every fifteen minutes is a bill and a queue slot. The
# heartbeat is the cheapest thing that would have caught the outage this file is
# named after, and catching that is the whole requirement.
name: Watch

on:
  # ── Two triggers, because one of them is a promise and the other is a fact ──
  #
  # The schedule is the one that matters: it is what notices an outage on a
  # quiet Sunday. It is also the one this repository has **not been able to
  # observe working** — the workflow sat on the default branch for four hours
  # with a quarter-hourly cron and did not fire once, while push-triggered runs
  # went through the whole time. GitHub's own documentation says the schedule
  # event is delayed under load and offers no guarantee, and Actions are fully
  # enabled here, so there is nothing left to configure and nothing to fix.
  #
  # Hourly rather than quarter-hourly, then: the longer the interval, the more
  # reliably GitHub honours it, and an outage found within an hour instead of
  # within two days is the whole of the improvement. At :23, because :00 is
  # where every hourly cron in the world lands.
  schedule:
    - cron: "23 * * * *"

  # And a trigger that has been watched working. Every push runs Checks; this
  # runs when Checks finishes, whatever it concluded. It cannot notice a quiet
  # outage — nothing that hangs off pushes can — but it means every change to
  # this product is followed, within the minute, by an answer to "is a render
  # machine still listening". By the time Checks has finished, a worker deploy
  # triggered by the same push has long since settled, so this does not alarm on
  # its own deploys.
  workflow_run:
    workflows: ["Checks"]
    types: [completed]

  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the deployment how it is
        run: |
          set -uo pipefail
          URL="https://app.editlyai.io/api/healthz"

          # Two attempts, thirty seconds apart. A single failed request is a
          # network, not an outage, and an alert that cries wolf gets muted —
          # which is the same as not having one.
          for attempt in 1 2; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            body=$(cat /tmp/health.json 2>/dev/null || echo '{}')
            status=$(printf '%s' "$body" | jq -r '.status // "unreadable"')
            online=$(printf '%s' "$body" | jq -r '.worker.online // false')
            age=$(printf '%s' "$body" | jq -r '.worker.lastSeenAgoSeconds // "never"')

            echo "attempt $attempt: HTTP $code, status $status, worker online $online, last beat ${age}s ago"
            if [ "$code" = "200" ] && [ "$status" = "ok" ] && [ "$online" = "true" ]; then
              echo "The API is up and a render machine is listening."
              exit 0
            fi
            [ "$attempt" = "1" ] && sleep 30
          done

          echo "::error::Editly is not healthy — HTTP $code, status $status, worker online $online, last beat ${age}s ago. $(printf '%s' "$body" | jq -c '{database, capabilities}' 2>/dev/null)"
          exit 1
